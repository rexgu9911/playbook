const $=id=>document.getElementById(id),UI=$('ui');let uiState='',uiScore=-1,uiBest=-1,uiCombo=-1;
if(ATTRACT){UI.remove()}else{UI.style.setProperty('--acc',T.acc);UI.style.setProperty('--acc2',T.acc2);if(THEME===2)UI.style.textShadow='0 1px 0 rgba(10,50,110,.6),0 0 14px rgba(10,50,110,.5)';$('name').textContent=NAMES[THEME];$('overT').textContent=['Wrecked','Sand-blasted','Iced'][THEME]}
function nearPop(c){if(ATTRACT)return;const el=$('pop');el.textContent='NEAR MISS'+(c>1?'  ×'+c:'')+'  +'+20*c;el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
function uiSync(){
  if(ATTRACT)return;
  if(humG&&AC){const tg=state==='play'?.05:0;humG.gain.value+=(tg-humG.gain.value)*.1;hum.frequency.value=55+speed*.9+Math.abs(sh.vx)*.8}
  if(uiState!==state){uiState=state;$('title').classList.toggle('on',state==='title');$('over').classList.toggle('on',state==='dead');$('hud').classList.toggle('on',state==='play');$('bar').classList.toggle('on',state==='play');
    if(state==='dead'){$('final').textContent=score;$('overS').textContent=(score>=best&&score>0?'NEW BEST  ·  ':'BEST '+best+'  ·  ')+shardsGot+' SHARDS  ·  '+nearN+' NEAR MISSES'}}
  if(uiScore!==score){const big=((score/250)|0)>((uiScore/250)|0)&&uiScore>=0;uiScore=score;const el=$('score');el.textContent=score;if(big){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}
  const b=Math.max(best,score);if(uiBest!==b){uiBest=b;$('best').textContent='BEST '+b}
  const cw=combo?Math.round(clamp(comboT/2.2,0,1)*100):0;if(cw!==uiCombo){uiCombo=cw;$('bar').firstChild.style.width=cw+'%'}
}
// ---------- loop ----------
let last=0,raf=0;
function frame(t){raf=0;if(document.hidden)return;const dt=clamp((t-last)/1000,0,1/20);last=t;update(dt);renderer.render(scene,camera);uiSync();raf=requestAnimationFrame(frame)}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',kick);
resize();reset();if(ATTRACT)startRun();
window.__game={get s(){return{state,score,x:+sh.x.toFixed(2),speed:+speed.toFixed(1),runs,nearN,shardsGot}}};
kick();
}
</script></body></html>
