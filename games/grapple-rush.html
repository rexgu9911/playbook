<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Grapple Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060f}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:800;--acc:#22e6ff;--acc2:#ff3df0}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(6px,2.4vmin,22px) clamp(10px,3vmin,28px);text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
#hud.on{opacity:1}
#score{font-size:clamp(20px,7.5vmin,58px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transform-origin:left top;display:inline-block}
#score small,#best{font-size:clamp(10px,2.6vmin,17px);letter-spacing:.14em;opacity:.8;font-weight:700}
#score small{margin-left:.3em}#best{text-align:right;padding-top:.3em;font-variant-numeric:tabular-nums}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(4px,1.8vmin,16px);padding:8px;opacity:0;transform:scale(.96);transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1);visibility:hidden}
.panel.on{opacity:1;transform:none;visibility:visible}
#title{justify-content:flex-start;padding-top:9vh}
#over{background:radial-gradient(ellipse at center,rgba(0,0,0,.5),rgba(0,0,0,.15) 70%,transparent)}
h1{margin:0;font-size:clamp(26px,12vmin,104px);line-height:.92;letter-spacing:-.035em;font-weight:900;text-transform:uppercase;font-style:italic;color:#fff;text-shadow:.045em .045em 0 var(--acc2),-.03em -.03em 0 var(--acc),0 .1em .5em rgba(0,0,0,.5)}
h2{margin:0;font-size:clamp(18px,7vmin,60px);letter-spacing:.04em;font-weight:900;text-transform:uppercase;text-shadow:.05em .05em 0 var(--acc2),0 .1em .5em rgba(0,0,0,.6)}
.cta{font-size:clamp(11px,3.3vmin,24px);letter-spacing:.06em;padding:.55em 1.2em;border-radius:99px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.75);animation:pulse 1.2s ease-in-out infinite;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.hint{font-size:clamp(9px,2.3vmin,16px);font-weight:600;opacity:.82;letter-spacing:.04em;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:92vw}
.big{font-size:clamp(28px,13vmin,110px);line-height:1;font-variant-numeric:tabular-nums;color:var(--acc);text-shadow:0 .06em 0 rgba(0,0,0,.45)}
.sub{font-size:clamp(10px,2.8vmin,20px);letter-spacing:.14em;opacity:.9}
@keyframes pulse{50%{transform:scale(1.06);background:rgba(255,255,255,.26)}}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.bump{animation:bump .25s ease-out}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><div id="hud"><div><span id="score">0<small>M</small></span></div><div id="best">BEST 0</div></div>
<div id="title" class="panel"><h1 id="name"></h1><div class="cta">Click / tap / press Space to play</div><div class="hint">Hold to fire your rope and swing &middot; release to fling forward &middot; don't fall</div></div>
<div id="over" class="panel"><h2 id="overT">Wiped out</h2><div class="big" id="final">0</div><div class="sub" id="overS"></div><div class="cta">Click / tap / Space to retry</div></div></div>
<script>
(()=>{'use strict';
const qs=new URLSearchParams(location.search);
const THEME=Math.max(0,Math.min(2,parseInt(qs.get('theme'),10)||0));
const ATTRACT=qs.get('attract')==='1';
const NAMES=['Grapple Rush','Jungle Swing','Cave Swing'];
document.title=NAMES[THEME];
const PAL=[
 {sky:['#060a22','#1a1147','#4a1d66'],accent:'#22e6ff',accent2:'#ff3df0',coin:'#ffe45c',rope:'#9af7ff',body:'#f4f7ff',dark:'#1b2350',visor:'#0b1030',eye:'#22e6ff',scarf:'#ff3df0',floor:'#05030f',hazard:'#ff2d6f',layers:['#1d1b52','#141040','#0a0826']},
 {sky:['#04281a','#0e5231','#5aa04e'],accent:'#c8ff5a',accent2:'#ffb23d',coin:'#ffd23d',rope:'#9be060',body:'#ff9a3d',dark:'#7a3a10',visor:'#fff3d6',eye:'#2a1608',scarf:'#ffe07a',floor:'#02140c',hazard:'#ff7a1f',layers:['#116239','#0a4427','#052a17']},
 {sky:['#0a0420','#221046','#4a2278'],accent:'#b98cff',accent2:'#5af0ff',coin:'#7dfcff',rope:'#e0d2ff',body:'#ffd9a0',dark:'#7a4a2a',visor:'#2b1548',eye:'#5af0ff',scarf:'#5af0ff',floor:'#06020f',hazard:'#ff4a8a',layers:['#2c1658','#1c0d3e','#0f0624']}
][THEME];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,TAU=Math.PI*2;
let seed=1;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+rnd()*(b-a);
// ---------- view ----------
let W=1,H=1,DPR=1,S=1,VW=1000,VH=600,OY=0;
// ---------- pre-rendered sky + parallax layers ----------
const TW=1200,PARA=[.12,.3,.55];let skyCv=null,layers=[],LS=1;
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function glowSprite(col,r){const c=mk(r*2,r*2),g=c.getContext('2d'),gr=g.createRadialGradient(r,r,0,r,r,r);gr.addColorStop(0,col);gr.addColorStop(.25,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=.9;g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return c}
const GLOW={a:glowSprite(PAL.accent,48),b:glowSprite(PAL.accent2,48),c:glowSprite(PAL.coin,40),h:glowSprite(PAL.hazard,48),w:glowSprite('#ffffff',32)};
function buildSky(){
  const c=mk(W*DPR,H*DPR),g=c.getContext('2d'),w=c.width,h=c.height,gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,PAL.sky[0]);gr.addColorStop(.55,PAL.sky[1]);gr.addColorStop(1,PAL.sky[2]);g.fillStyle=gr;g.fillRect(0,0,w,h);
  const s0=seed;seed=4242;const u=Math.min(w,h);
  if(THEME===0){for(let i=0;i<90;i++){g.globalAlpha=rr(.2,.9);g.fillStyle=rnd()<.2?PAL.accent:'#fff';const r=rr(.5,1.6)*DPR;g.fillRect(rnd()*w,rnd()*h*.7,r,r)}
    const mx=w*.74,my=h*.26,mr=u*.16;g.globalAlpha=1;const mg=g.createRadialGradient(mx,my,mr*.2,mx,my,mr*2.6);mg.addColorStop(0,'rgba(255,61,240,.35)');mg.addColorStop(1,'rgba(255,61,240,0)');g.fillStyle=mg;g.fillRect(0,0,w,h);
    const dg=g.createLinearGradient(0,my-mr,0,my+mr);dg.addColorStop(0,'#ffe9a8');dg.addColorStop(1,'#ff5fd0');g.fillStyle=dg;g.beginPath();g.arc(mx,my,mr,0,TAU);g.fill();
    g.fillStyle=PAL.sky[1];for(let i=0;i<5;i++){const y=my+mr*(.1+i*.19);g.fillRect(mx-mr,y,mr*2,mr*(.03+i*.018))}}
  else if(THEME===1){g.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const x=w*(.1+i*.15)+rr(-30,30),bw=u*rr(.04,.11);g.globalAlpha=rr(.05,.13);const sg=g.createLinearGradient(0,0,0,h);sg.addColorStop(0,'#f6ffb0');sg.addColorStop(1,'rgba(246,255,176,0)');g.fillStyle=sg;g.beginPath();g.moveTo(x,0);g.lineTo(x+bw,0);g.lineTo(x+bw-h*.35,h);g.lineTo(x-h*.35-bw,h);g.fill()}}
  else{for(let i=0;i<5;i++){const x=rnd()*w,y=rnd()*h,r=u*rr(.25,.5);const cg=g.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,i%2?'rgba(90,240,255,.13)':'rgba(185,140,255,.16)');cg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=cg;g.fillRect(0,0,w,h)}}
  seed=s0;skyCv=c;
}
function buildLayers(){
  LS=clamp(S*DPR,.3,1.5);layers=[];const s0=seed;
  for(let li=0;li<3;li++){seed=900+li*37+THEME*11;const c=mk(TW*LS,600*LS),g=c.getContext('2d');g.scale(LS,LS);const col=PAL.layers[li];
    for(let rep=-1;rep<=1;rep++){g.save();g.translate(rep*TW,0);const s1=seed;seed=900+li*37+THEME*11;drawLayer(g,li,col);if(rep<1)seed=s1;g.restore()}
    layers.push(c)}
  seed=s0;
}
function drawLayer(g,li,col){
  g.fillStyle=col;
  if(THEME===0){let x=0;while(x<TW){const bw=Math.min(TW-x,rr(46,120)),bh=[rr(170,400),rr(120,320),rr(60,190)][li],y=600-bh;
      g.fillStyle=col;g.fillRect(x,y,bw-3,bh);
      if(rnd()<.4){g.fillRect(x+bw*.3,y-rr(12,30),bw*.3,34)}if(rnd()<.3){g.fillRect(x+bw*.5,y-rr(30,60),2,60);g.fillStyle=PAL.hazard;g.fillRect(x+bw*.5-1,y-62,4,4)}
      const cols=['#22e6ff','#ff3df0','#ffe45c'],wc=cols[(rnd()*3)|0];
      for(let wy=y+10;wy<590;wy+=13)for(let wx=x+7;wx<x+bw-12;wx+=11)if(rnd()<.28){g.globalAlpha=rr(.15,.6)*(.5+li*.25);g.fillStyle=rnd()<.8?wc:'#fff';g.fillRect(wx,wy,5,7)}
      g.globalAlpha=1;if(li>0&&rnd()<.3){g.fillStyle=rnd()<.5?PAL.accent:PAL.accent2;g.globalAlpha=.8;g.fillRect(x+4,y+rr(20,60),4,rr(30,70));g.globalAlpha=1}
      x+=bw}}
  else if(THEME===1){const n=[9,7,6][li];
    g.beginPath();g.moveTo(-10,600);for(let x=-10;x<=TW+10;x+=40)g.lineTo(x,600-[150,100,50][li]-Math.sin(x/TW*TAU*(2+li))*22-Math.sin(x/TW*TAU*5)*8);g.lineTo(TW+10,600);g.fill();
    for(let i=0;i<n;i++){const x=(i+rr(.2,.8))/n*TW,tw=[14,22,34][li]*rr(.8,1.3),top=rr(60,200)-li*30;
      g.beginPath();g.moveTo(x-tw*.6,600);g.lineTo(x-tw*.35,top);g.lineTo(x+tw*.35,top);g.lineTo(x+tw*.6,600);g.fill();
      for(let k=0;k<7;k++){g.beginPath();g.ellipse(x+rr(-70,70),top+rr(-50,30),rr(40,80),rr(26,46),0,0,TAU);g.fill()}}
    for(let x=0;x<TW;x+=rr(30,70)){g.beginPath();g.ellipse(x,rr(-10,18+li*8),rr(50,90),rr(30,52),0,0,TAU);g.fill()}
    if(li>0){g.strokeStyle=col;g.lineWidth=2+li;for(let i=0;i<6;i++){const x=rr(0,TW),len=rr(80,230);g.beginPath();g.moveTo(x,0);g.quadraticCurveTo(x+rr(-40,40),len*.6,x+rr(-25,25),len);g.stroke()}}
    g.fillStyle=PAL.accent;for(let i=0;i<10;i++){g.globalAlpha=rr(.05,.16);g.beginPath();g.ellipse(rr(0,TW),rr(40,420),rr(6,14),rr(3,6),rr(0,3),0,TAU);g.fill()}g.globalAlpha=1}
  else{const jag=(base,amp,flip)=>{g.beginPath();const y0=flip?0:600;g.moveTo(-5,y0);const pts=[];const n=16+li*4;for(let i=0;i<n;i++)pts.push(rr(.15,1));
      for(let i=0;i<=n;i++){const x=i/n*TW,v=pts[i%n],hgt=base+amp*v*v;g.lineTo(x-TW/n*.5,flip?base*.6:600-base*.6);g.lineTo(x,flip?hgt:600-hgt)}g.lineTo(TW+5,y0);g.fill()};
    g.fillStyle=col;jag([130,90,40][li],[190,150,110][li],false);jag([70,50,26][li],[150,120,80][li],true);
    if(li<2)for(let i=0;i<7;i++){const x=rr(40,TW-40),y=rnd()<.5?rr(380,560):rr(30,150),cc=rnd()<.5?PAL.accent:PAL.accent2;
      g.save();g.translate(x,y);g.shadowColor=cc;g.shadowBlur=18;g.globalAlpha=.5+li*.3;for(let k=0;k<4;k++){g.rotate(rr(-.7,.7));const hh=rr(18,44),ww=rr(5,10);g.fillStyle=cc;g.beginPath();g.moveTo(0,-hh);g.lineTo(ww,0);g.lineTo(0,ww);g.lineTo(-ww,0);g.fill()}g.restore()}
    g.globalAlpha=1}
}
function drawLayers(){
  const k=S*DPR;
  for(let li=0;li<3;li++){const c=layers[li];if(!c)continue;const tw=TW*k,th=600*k,y=(OY-cam.y*PARA[li])*k;
    let x=-(((cam.x*PARA[li])%TW)+TW)%TW*k;
    ctx.fillStyle=PAL.layers[li];if(y+th<H*DPR)ctx.fillRect(0,y+th-1,W*DPR,H*DPR-y-th+2);if(THEME>0&&y>0)ctx.fillRect(0,0,W*DPR,y+1);
    for(;x<W*DPR;x+=tw)ctx.drawImage(c,x,y,tw+1,th)}
}
function resize(){
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  S=Math.min(H/600,W/600);VW=W/S;VH=H/S;OY=(VH-600)*.72;
  buildSky();buildLayers();
}
addEventListener('resize',resize);
// ---------- constants ----------
const G=1500,RANGE=400,REEL_MIN=240,REEL_V=150,BOOST=270,MAXV=1050,FLING=1.08,DEATH_Y=640;
// ---------- state ----------
let state='title',time=0,runT=0,deadT=0,runs=0,score=0,best=0,coinsGot=0,hold=false,holdUsed=false;
let anchors=[],coins=[],nextAX=0,aIdx=0,chaserX=-600,shake=0,hitstop=0,target=null;
const p={x:0,y:0,vx:0,vy:0,att:null,L:0,sq:0,ropeT:0,rot:0};
const cam={x:0,y:0};
// ---------- audio (WebAudio synth, created on first gesture) ----------
let AC=null,master=null,noiseBuf=null;
function initAudio(){if(ATTRACT||AC)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function tone(type,f0,f1,dur,vol,delay){const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,f0,f1){const t=AC.currentTime,s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();s.buffer=noiseBuf;fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02)}
function sfx(n,v){if(!AC||ATTRACT)return;try{
  if(n==='attach'){tone('square',300,720,.07,.12);tone('triangle',720,540,.12,.12,.05)}
  else if(n==='release')noise(.22,clamp((v||400)/2600,.08,.35),500,2600);
  else if(n==='coin'){const f=660*Math.pow(2,((v||1)-1)/12);tone('triangle',f,f,.09,.2);tone('triangle',f*1.5,f*1.5,.16,.18,.06)}
  else if(n==='die'){tone('sawtooth',320,40,.55,.3);noise(.45,.4,1800,120)}
  else if(n==='start'){tone('triangle',330,660,.12,.18);tone('triangle',660,990,.14,.16,.09)}
}catch(e){}}

// ---------- fx ----------
const PMAX=ATTRACT?110:240,parts=[],trail=[],pops=[],motes=[];let coinChain=0,coinChainT=0,flash=0;
function spawn(x,y,vx,vy,life,size,col,kind){if(parts.length>=PMAX)parts.shift();parts.push({x,y,vx,vy,life,max:life,size,col,kind:kind||0})}
function burst(x,y,n,spd,col,life,size){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.35+Math.random()*.65);spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,life*(.6+Math.random()*.4),size*(.6+Math.random()*.6),col,0)}}
for(let i=0;i<(ATTRACT?18:30);i++)motes.push({x:Math.random()*1400,y:Math.random()*600,ph:Math.random()*TAU,s:.5+Math.random()});
function fxUpdate(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue}
    if(q.kind===0){q.vy+=500*dt;q.vx*=1-dt*1.5}q.x+=q.vx*dt;q.y+=q.vy*dt}
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>.8)pops.splice(i,1)}
  if(state==='play'){trail.push(p.x,p.y);if(trail.length>36)trail.splice(0,2);
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>720&&Math.random()<.5)spawn(p.x+VW*.6*Math.random(),p.y+(Math.random()-.5)*260,-sp*.9,0,.25,26+Math.random()*30,'#fff',2);
    if(p.att&&Math.random()<.3)spawn(p.x,p.y+10,-p.vx*.2,-p.vy*.2,.35,3,PAL.scarf,0)}
  else if(trail.length)trail.splice(0,2);
  coinChainT-=dt;if(coinChainT<=0)coinChain=0;flash*=Math.exp(-dt*7);
  if(chaserX>cam.x-60&&state==='play'&&Math.random()<.5)spawn(chaserX+10,-OY+Math.random()*VH,160+Math.random()*200,(Math.random()-.5)*120,.5,4,PAL.hazard,3);
}
function drawAmbient(){
  const fw=VW+200;
  for(const m of motes){const x=cam.x-100+((((m.x*fw/1400-cam.x*.8*m.s)%fw)+fw)%fw);
    if(THEME===0){const y=((m.y+time*520*m.s)%700)-50;ctx.strokeStyle=PAL.accent;ctx.globalAlpha=.16;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-7,y+26);ctx.stroke();ctx.globalAlpha=1}
    else if(THEME===1){const y=m.y*.8+60+Math.sin(time*m.s+m.ph)*30,xx=x+Math.cos(time*.7*m.s+m.ph)*24;glow(GLOW.a,xx,y,11,.35+.35*Math.sin(time*3*m.s+m.ph))}
    else{const y=((m.y-time*18*m.s)%600+600)%600;glow(m.ph>3?GLOW.b:GLOW.a,x,y,5+m.s*3,.25+.2*Math.sin(time*2+m.ph))}}
}
function drawTrail(){
  const n=trail.length/2;if(n<3)return;ctx.fillStyle=PAL.scarf;ctx.globalAlpha=.85;ctx.beginPath();
  const L=[],R=[];for(let i=0;i<n;i++){const x=trail[i*2],y=trail[i*2+1],j=Math.min(n-1,i+1),k=Math.max(0,i-1),dx=trail[j*2]-trail[k*2],dy=trail[j*2+1]-trail[k*2+1],d=Math.hypot(dx,dy)||1,w=(i/n)*6.5,wv=Math.sin(i*.9-time*14)*(1-i/n)*5;
    L.push(x-dy/d*(w+wv),y+dx/d*(w+wv));R.push(x+dy/d*(w-wv),y-dx/d*(w-wv))}
  ctx.moveTo(L[0],L[1]);for(let i=2;i<L.length;i+=2)ctx.lineTo(L[i],L[i+1]);for(let i=R.length-2;i>=0;i-=2)ctx.lineTo(R[i],R[i+1]);ctx.fill();ctx.globalAlpha=1;
}
function drawFX(){
  for(const q of parts){const a=q.life/q.max;ctx.globalAlpha=a;
    if(q.kind===1){ctx.strokeStyle=q.col;ctx.lineWidth=3*a+.5;ctx.beginPath();ctx.arc(q.x,q.y,q.size*(1.2-a),0,TAU);ctx.stroke()}
    else if(q.kind===2){ctx.globalAlpha=a*.35;ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,q.size,1.5)}
    else{ctx.fillStyle=q.col;const s=q.size*(.4+a*.6);ctx.fillRect(q.x-s/2,q.y-s/2,s,s)}}

  const b=Math.max(best,score);if(uiBest!==b){uiBest=b;$('best').textContent='BEST '+b}
}
// ---------- loop ----------
let last=0,raf=0;
function frame(t){raf=0;if(document.hidden)return;const dt=clamp((t-last)/1000,0,1/20);last=t;update(dt);render();uiSync();raf=requestAnimationFrame(frame)}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
document.addEventListener('visibilitychange',kick);
resize();reset();if(ATTRACT)startRun();
window.__game={get s(){return{state,score,x:p.x,y:p.y,runs}}};
kick();
})();
</script></body></html>
