<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tile Forge</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#120d0b;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%;cursor:pointer}
</style></head><body><canvas id="c"></canvas>
<script>
(function(){'use strict';
var Q=new URLSearchParams(location.search);
var THEME=Math.max(0,Math.min(2,parseInt(Q.get('theme'),10)||0));
var ATTRACT=Q.get('attract')==='1';
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=320,H=200,DPR=1;
var FONT='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
// deterministic rng
var seed=1234567;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function ri(n){return Math.floor(rnd()*n);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
var TH=[
 {name:'TILE FORGE',bg0:'#1a110d',bg1:'#070504',ink:'#ffe9c9',dim:'#b98a62',acc:'#ff8a1f',panel:'#241a16',
  cols:['#ff7a1a','#ffd23a','#5fb4ff','#4fd39a','#ff3d55','#b77bff']},
 {name:'GEM FORGE',bg0:'#3a0f3a',bg1:'#12041a',ink:'#fff3d6',dim:'#c9a3c9',acc:'#ffd76a',panel:'#22082a',
  cols:['#ff3b5c','#3d8bff','#27d98a','#ffc93c','#b45cff','#ff8a3c']},
 {name:'MOCHI POP',bg0:'#fff6ec',bg1:'#ffe3ee',ink:'#5b4a66',dim:'#a892b3',acc:'#ff7fa8',panel:'#ffffff',
  cols:['#ff9fbd','#8fe3c0','#8fc9ff','#ffe08a','#c9a8ff','#ffb98f']}
];
var T=TH[THEME];document.title=T.name.replace(/\B\w/g,function(m){return m.toLowerCase();});
document.body.style.background=T.bg1;
function hex(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function shade(h,a){var c=hex(h),t=a<0?0:255,k=Math.abs(a);return'rgb('+Math.round(c[0]+(t-c[0])*k)+','+Math.round(c[1]+(t-c[1])*k)+','+Math.round(c[2]+(t-c[2])*k)+')';}
function rgba(h,a){var c=hex(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function poly(g,n,r,rot,sx,sy){g.beginPath();for(var i=0;i<n;i++){var a=rot+i/n*6.2832;g[i?'lineTo':'moveTo'](Math.cos(a)*r*(sx||1),Math.sin(a)*r*(sy||1));}g.closePath();}
// --- tile painters: draw centred at 0,0 for tile size s ---
function paintIngot(g,c,s,col){
  var w=s*0.86,h=s*0.8,b=s*0.13;
  g.fillStyle='rgba(0,0,0,0.45)';rr(g,-w/2,-h/2+s*0.07,w,h,s*0.12);g.fill();
  g.fillStyle=shade(col,-0.5);rr(g,-w/2,-h/2,w,h,s*0.12);g.fill();
  var gr=g.createLinearGradient(0,-h/2,0,h/2);gr.addColorStop(0,shade(col,0.45));gr.addColorStop(0.5,col);gr.addColorStop(1,shade(col,-0.3));
  g.fillStyle=gr;rr(g,-w/2+b*0.4,-h/2+b*0.3,w-b*0.8,h-b*1.1,s*0.1);g.fill();
  var rg=g.createRadialGradient(0,-s*0.05,0,0,0,s*0.42);rg.addColorStop(0,'rgba(255,255,230,0.75)');rg.addColorStop(1,'rgba(255,255,230,0)');
  g.fillStyle=rg;rr(g,-w/2+b,-h/2+b,w-b*2,h-b*2.3,s*0.07);g.fill();
  g.strokeStyle=shade(col,-0.55);g.lineWidth=Math.max(1,s*0.055);g.lineCap='round';g.lineJoin='round';g.beginPath();
  var u=s*0.13;
  if(c===0){g.moveTo(-u,u*0.6);g.lineTo(0,-u);g.lineTo(u,u*0.6);}
  else if(c===1){g.moveTo(-u,0);g.lineTo(u,0);g.moveTo(0,-u);g.lineTo(0,u);}
  else if(c===2){g.moveTo(-u,-u*0.5);g.lineTo(u,-u*0.5);g.moveTo(-u,u*0.5);g.lineTo(u,u*0.5);}
  else if(c===3){g.arc(0,0,u*0.9,0,6.2832);}
  else if(c===4){g.moveTo(-u,-u);g.lineTo(u,u);g.moveTo(u,-u);g.lineTo(-u,u);}
  else if(c===5){g.moveTo(0,-u);g.lineTo(u,0);g.lineTo(0,u);g.lineTo(-u,0);g.closePath();}
  g.stroke();
  g.fillStyle='rgba(255,255,255,0.55)';rr(g,-w/2+b,-h/2+b*0.55,w-b*2,s*0.045,s*0.03);g.fill();
}
var GEMS=[[4,0,1,1.08],[6,0.5236,1,1],[8,0.3927,0.94,1.06],[3,-1.5708,1.12,1.08],[12,0,1,1],[5,-1.5708,1.05,1.05]];
function paintGem(g,c,s,col){
  var d=GEMS[c],n=d[0],rot=d[1],R=s*0.43,i,a0,a1;
  g.save();g.translate(0,c===3?s*0.07:0);
  g.fillStyle='rgba(0,0,0,0.35)';g.save();g.translate(0,s*0.06);poly(g,n,R,rot,d[2],d[3]);g.fill();g.restore();
  for(i=0;i<n;i++){a0=rot+i/n*6.2832;a1=rot+(i+1)/n*6.2832;var m=(a0+a1)/2,l=-Math.sin(m)*0.42-Math.cos(m)*0.14+((i%2)?0.1:-0.06);
    g.fillStyle=shade(col,clamp(l,-0.6,0.7));g.beginPath();
    g.moveTo(Math.cos(a0)*R*d[2],Math.sin(a0)*R*d[3]);g.lineTo(Math.cos(a1)*R*d[2],Math.sin(a1)*R*d[3]);
    g.lineTo(Math.cos(a1)*R*0.55*d[2],Math.sin(a1)*R*0.55*d[3]);g.lineTo(Math.cos(a0)*R*0.55*d[2],Math.sin(a0)*R*0.55*d[3]);g.closePath();g.fill();}
  var gr=g.createLinearGradient(-R*0.5,-R*0.5,R*0.5,R*0.5);gr.addColorStop(0,shade(col,0.55));gr.addColorStop(0.5,shade(col,0.12));gr.addColorStop(1,shade(col,-0.25));
  g.fillStyle=gr;poly(g,n,R*0.55,rot,d[2],d[3]);g.fill();
  g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=Math.max(0.6,s*0.018);poly(g,n,R,rot,d[2],d[3]);g.stroke();
  g.fillStyle='rgba(255,255,255,0.8)';g.beginPath();g.ellipse(-R*0.18,-R*0.2,R*0.13,R*0.06,-0.7,0,6.2832);g.fill();
  g.restore();
}
function mochiPath(g,c,s){
  var R=s*0.43,i,a,k;g.beginPath();
  for(i=0;i<=40;i++){a=i/40*6.2832;var cx=Math.cos(a),sy=Math.sin(a),r=R;
    if(c===1||c===4){k=c===1?4:3;r=R*1.02/Math.pow(Math.pow(Math.abs(cx),k)+Math.pow(Math.abs(sy),k),1/k);}
    else if(c===2){r=R*(1+0.16*Math.pow(Math.max(0,-sy),6));}
    else if(c===3){r=R*(1+0.14*Math.pow(Math.max(0,Math.cos((a+1.5708)*2+3.1416)),5)*(sy<0?1:0));}
    else if(c===5){r=R*(1+0.045*Math.cos(a*6));}
    g[i?'lineTo':'moveTo'](cx*r,sy*r*(c===0?0.94:c===3?0.9:0.97)+s*0.02);}
  g.closePath();
}
function paintMochi(g,c,s,col){
  g.fillStyle=rgba(shade(col,-0.35).replace(/[^\d,]/g,'').split(',').reduce(function(h,v){return h+('0'+(+v).toString(16)).slice(-2);},'#'),0.28);
  g.save();g.translate(0,s*0.07);g.scale(1,0.9);mochiPath(g,c,s);g.fill();g.restore();
  var gr=g.createRadialGradient(-s*0.12,-s*0.16,s*0.03,0,0,s*0.5);gr.addColorStop(0,shade(col,0.5));gr.addColorStop(0.6,col);gr.addColorStop(1,shade(col,-0.14));
  g.fillStyle=gr;mochiPath(g,c,s);g.fill();
  g.fillStyle='rgba(255,255,255,0.75)';g.beginPath();g.ellipse(-s*0.17,-s*0.22,s*0.09,s*0.05,-0.6,0,6.2832);g.fill();
  g.fillStyle=rgba('#ff6f91',0.35);g.beginPath();g.arc(-s*0.21,s*0.08,s*0.055,0,6.2832);g.arc(s*0.21,s*0.08,s*0.055,0,6.2832);g.fill();
}
function paintSpecial(g,sp,s){
  var base=THEME===0?'#6b6f7a':THEME===1?'#eef4ff':'#ffffff',ic=THEME===0?'#ffb347':THEME===1?'#7a3cff':'#ff7fa8';
  if(THEME===0)paintIngot(g,-1,s,base);else if(THEME===1){GEMS[6]=[10,0,1,1];paintGem(g,6,s,base);}else paintMochi(g,5,s,base);
  g.strokeStyle=ic;g.fillStyle=ic;g.lineWidth=Math.max(1.5,s*0.07);g.lineCap='round';g.lineJoin='round';var u=s*0.2;
  if(sp===1){g.beginPath();g.moveTo(-u,0);g.lineTo(u,0);g.moveTo(-u*0.45,-u*0.55);g.lineTo(-u,0);g.lineTo(-u*0.45,u*0.55);g.moveTo(u*0.45,-u*0.55);g.lineTo(u,0);g.lineTo(u*0.45,u*0.55);g.stroke();}
  else{g.beginPath();for(var i=0;i<16;i++){var a=i/16*6.2832,r=i%2?u*0.5:u*1.1;g[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(0,0,u*0.25,0,6.2832);g.fill();}
}
var sprites=[],SPR=1;
// ---- state ----
var COLS=7,ROWS=9,TS=40,BX=0,BY=0,HUDH=0;
var grid=[];           // grid[col][row], row 0 = top
var state='title';     // title | play | over
var score=0,best=0,shownScore=0,moves=0,level=1,heat=0,heatNeed=55,ncol=4;
var time=0,shake=0,freeze=0,stateT=0,overT=0;
var parts=[],pops=[],ghosts=[],ripples=[];
var hover=null,hoverSet=null,cursor=null,banner=null;
var demo=true;      // autopilot active
var aiT=0.5,aiPick=null;

function newTile(c,sp){return{c:c,sp:sp||0,oy:0,vy:0,delay:0,landed:true,sq:0,sqv:0,pop:0,ph:rnd()*6.28,blink:rnd()*4};}
function chooseGrid(){
  var aw=W-12,ah=H-HUDH-12,cands=[[7,9],[8,8],[9,7],[10,6],[11,5],[12,5],[6,10]],bestTs=0,b=cands[0];
  for(var i=0;i<cands.length;i++){var t=Math.min(aw/cands[i][0],ah/cands[i][1]);if(t>bestTs+0.01){bestTs=t;b=cands[i];}}
  COLS=b[0];ROWS=b[1];
}
function layout(){
  HUDH=ATTRACT?0:clamp(H*0.17,40,96);
  var aw=W-12,ah=H-HUDH-12;
  TS=Math.max(8,Math.floor(Math.min(aw/COLS,ah/ROWS)));
  BX=Math.round((W-TS*COLS)/2);BY=Math.round(HUDH+(H-HUDH-TS*ROWS)/2);
  buildSprites();
}
function fillBoard(){
  grid=[];
  for(var x=0;x<COLS;x++){grid[x]=[];for(var y=0;y<ROWS;y++){var t=newTile(ri(ncol));t.oy=ROWS+2+(ROWS-y)*0.35;t.delay=x*0.035+(ROWS-1-y)*0.02;t.landed=false;grid[x][y]=t;}}
}
function resetGame(){
  score=0;shownScore=0;level=1;heat=0;heatNeed=55;ncol=4;moves=ATTRACT?26:20;
  parts.length=0;pops.length=0;ghosts.length=0;ripples.length=0;banner=null;hover=null;hoverSet=null;aiT=0.9;aiPick=null;overT=0;
  chooseGrid();layout();fillBoard();
}
function groupAt(x,y){
  var t=grid[x]&&grid[x][y];if(!t)return[];
  if(t.sp)return[[x,y]];
  var seen={},out=[],st=[[x,y]];seen[x+','+y]=1;
  while(st.length){var p=st.pop();out.push(p);
    var n=[[p[0]+1,p[1]],[p[0]-1,p[1]],[p[0],p[1]+1],[p[0],p[1]-1]];
    for(var i=0;i<4;i++){var a=n[i][0],b=n[i][1],k=a+','+b;if(a<0||b<0||a>=COLS||b>=ROWS||seen[k])continue;var u=grid[a][b];if(u&&!u.sp&&u.c===t.c){seen[k]=1;st.push([a,b]);}}}
  return out;
}
function busy(){for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++){var t=grid[x][y];if(!t||!t.landed)return true;}return false;}
function cellXY(x,y){return[BX+(x+0.5)*TS,BY+(y+0.5)*TS];}
function removeCell(x,y){
  var t=grid[x][y];if(!t)return;grid[x][y]=null;
  var p=cellXY(x,y);ghosts.push({x:p[0],y:p[1],c:t.c,sp:t.sp,t:0});burst(p[0],p[1],t.sp?-1:t.c,ATTRACT?4:6);
}
function collapse(){
  for(var x=0;x<COLS;x++){
    var col=grid[x],w=ROWS-1,add=0;
    for(var y=ROWS-1;y>=0;y--){var t=col[y];if(t){if(w!==y){col[w]=t;col[y]=null;t.oy+=w-y;t.landed=false;t.delay=0.03+(ROWS-1-w)*0.012;}w--;}}
    for(y=w;y>=0;y--){var n=newTile(ri(ncol));n.oy=w+1.5+add*0.25;n.landed=false;n.delay=0.06+(w-y)*0.03;col[y]=n;add++;}
  }
}
// ---- audio (created on first gesture, never in attract) ----
var AC=null,master=null;
function initAudio(){
  if(ATTRACT||AC)return;
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(f,d,type,vol,slide,when){
  if(!AC||demo)return;
  try{var t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(Math.max(30,f),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}catch(e){}
}
function noise(d,vol,freq){
  if(!AC||demo)return;
  try{var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||1200;g.gain.value=vol||0.2;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start();}catch(e){}
}
var VOICE=[['triangle',220],['sine',520],['sine',330]][THEME];
function sfxPop(n){var f=VOICE[1]*Math.pow(1.0595,Math.min(n,14)*2);tone(f,0.16,VOICE[0],0.22,THEME===2?1.6:THEME===1?1:0.7);
  if(THEME===1)tone(f*2,0.3,'sine',0.08);if(THEME===0)noise(0.08,0.15,2600);if(n>=5)tone(f*1.5,0.22,VOICE[0],0.16,1,0.07);}
function sfxBoom(){noise(0.4,0.5,700);tone(110,0.4,'sine',0.4,0.4);}
function sfxLevel(){[0,4,7,12].forEach(function(s,i){tone(VOICE[1]*Math.pow(1.0595,s),0.22,VOICE[0],0.2,1,i*0.08);});}
function sfxOver(){[7,3,0,-5].forEach(function(s,i){tone(VOICE[1]*0.5*Math.pow(1.0595,s),0.3,'triangle',0.22,1,i*0.14);});}
function sfxBad(){tone(140,0.12,'square',0.07,0.8);}
// ---- gameplay ----
function pointsFor(n){return Math.round(n*5*Math.pow(1.4,n-2)/5)*5*level;}
function addHeat(v){
  heat+=v;
  if(heat>=heatNeed){heat-=heatNeed;if(heat>heatNeed*0.5)heat=heatNeed*0.5;level++;heatNeed=Math.round(heatNeed*1.3+8);
    var bonus=Math.max(4,9-Math.floor(level/3));moves+=bonus;if(level>=3)ncol=5;if(level>=6)ncol=6;
    if(!demo)banner={txt:'HEAT '+level+'  +'+bonus+' MOVES',t:0};shake+=8;sfxLevel();
    for(var i=0;i<(ATTRACT?24:50);i++)spawnPart(W*rnd(),HUDH||0,(rnd()-0.5)*300,rnd()*260,ri(ncol),0.9);}
}
function popup(x,y,txt,big){if(!demo)pops.push({x:x,y:y,txt:txt,t:0,big:big||1});}
function blast(x,y,sp,acc){ // collect cells hit by a special, chaining
  var i,j,list=[];
  if(sp===1){for(i=0;i<COLS;i++)list.push([i,y]);}
  else{for(i=-2;i<=2;i++)for(j=-2;j<=2;j++)if(Math.abs(i)+Math.abs(j)<=2)list.push([x+i,y+j]);}
  for(i=0;i<list.length;i++){var a=list[i][0],b=list[i][1];if(a<0||b<0||a>=COLS||b>=ROWS)continue;var t=grid[a][b];if(!t||t.hit)continue;t.hit=1;acc.push([a,b]);
    if(t.sp&&!(a===x&&b===y))blast(a,b,t.sp,acc);}
  var p=cellXY(x,y);ripples.push({x:p[0],y:p[1],t:0,row:sp===1,max:sp===1?W:TS*3});
}
function play(x,y){
  if(busy()||!grid[x]||!grid[x][y])return false;
  var t=grid[x][y],g,i,p=cellXY(x,y),n,pts;
  if(t.sp){g=[];blast(x,y,t.sp,g);n=g.length;pts=n*20*level;sfxBoom();shake+=14;freeze=0.09;}
  else{g=groupAt(x,y);n=g.length;
    if(n<2){t.sqv+=5;sfxBad();return false;}
    pts=pointsFor(n);sfxPop(n);shake+=Math.min(14,n*1.3);if(n>=5)freeze=Math.min(0.1,0.02+n*0.008);}
  for(i=0;i<n;i++)removeCell(g[i][0],g[i][1]);
  if(!t.sp&&n>=6){var s=newTile(0,n>=9?2:1);s.pop=1;s.sqv=8;grid[x][y]=s;}
  score+=pts;if(score>best&&!demo)best=score;moves--;
  popup(p[0],p[1],'+'+pts,n>=9?1.7:n>=6?1.35:n>=4?1.1:0.9);
  ripples.push({x:p[0],y:p[1],t:0,row:false,max:TS*(0.8+n*0.18)});
  addHeat(n<3?1:Math.pow(n,1.45));
  collapse();hover=null;hoverSet=null;return true;
}
function anyMove(){for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++){var t=grid[x][y];if(!t)continue;if(t.sp)return true;
  if(x+1<COLS&&grid[x+1][y]&&!grid[x+1][y].sp&&grid[x+1][y].c===t.c)return true;if(y+1<ROWS&&grid[x][y+1]&&!grid[x][y+1].sp&&grid[x][y+1].c===t.c)return true;}return false;}
function reshuffle(){for(var x=0;x<COLS;x++)for(var y=0;y<ROWS;y++){var t=grid[x][y];if(t&&!t.sp){t.c=ri(ncol);t.sqv+=6;t.pop=1;}}}
function spawnPart(x,y,vx,vy,c,life){
  if(parts.length>=(ATTRACT?110:240))return;
  parts.push({x:x,y:y,vx:vx,vy:vy,c:c,t:0,life:life*(0.6+rnd()*0.6),s:0.5+rnd()*0.9,r:rnd()*6.28,vr:(rnd()-0.5)*12});
}
function burst(x,y,c,n){for(var i=0;i<n;i++){var a=rnd()*6.2832,v=TS*(2+rnd()*7);spawnPart(x,y,Math.cos(a)*v,Math.sin(a)*v-TS*3,c,0.7);}}
function buildSprites(){
  SPR=Math.max(8,Math.ceil(TS*1.3*DPR));
  for(var i=0;i<8;i++){
    var c=sprites[i]||(sprites[i]=document.createElement('canvas'));c.width=c.height=SPR;
    var g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,SPR,SPR);g.translate(SPR/2,SPR/2);var s=SPR/1.3;
    if(i>=6)paintSpecial(g,i-5,s);

    if(t.gone){t.vy+=G*dt;t.oy-=t.vy*dt;continue;}
    t.vy+=G*dt;t.oy-=t.vy*dt;

  if(ATTRACT)return;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(i=0;i<pops.length;i++){p=pops[i];k=p.t;var e=k<0.18?k/0.18:1,sc=(0.5+0.5*e*(2-e))*(1+0.25*Math.sin(Math.min(1,k*5)*3.14));
    var fs=clamp(TS*0.5*p.big,11,64)*sc;ctx.font='800 '+fs.toFixed(1)+'px '+FONT;ctx.globalAlpha=k>0.7?(1-k)/0.3:1;
    var px=clamp(p.x,fs*1.6,W-fs*1.6),py=p.y-TS*(0.2+k*1.1);
    ctx.lineWidth=fs*0.22;ctx.lineJoin='round';ctx.strokeStyle=THEME===2?'#ffffff':'rgba(0,0,0,0.75)';ctx.strokeText(p.txt,px,py);
    ctx.fillStyle=THEME===2?'#ff5f93':T.acc;ctx.fillText(p.txt,px,py);}
  ctx.globalAlpha=1;
}
// ---- loop ----
var last=0,raf=0;
function frame(ts){
  raf=0;
  if(document.hidden)return;
  var dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  if(freeze>0){freeze-=dt;dt=0;}
  try{update(dt);render();}catch(e){if(window.console)console.warn(e);}
  raf=requestAnimationFrame(frame);
}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',kick);
function resize(){
  var w=window.innerWidth||document.documentElement.clientWidth||320,h=window.innerHeight||document.documentElement.clientHeight||200;
  W=Math.max(120,w);H=Math.max(100,h);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(demo||state!=='play'){var oc=COLS,or=ROWS;HUDH=ATTRACT?0:clamp(H*0.17,40,96);chooseGrid();if(oc!==COLS||or!==ROWS||!grid.length){fillBoard();}}
  layout();
}
window.addEventListener('resize',resize);
if(!ATTRACT){
  var cellAt=function(e){var r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-BX)/TS),y=Math.floor((e.clientY-r.top-BY)/TS);return(x<0||y<0||x>=COLS||y>=ROWS)?null:[x,y];};
  var tryStart=function(){if(demo||state==='title'||(state==='over'&&overT>0.7)){startGame();return true;}return false;};
  cv.addEventListener('pointerdown',function(e){e.preventDefault();cursor=null;
    if(demo||state!=='play'){tryStart();return;}
    var c=cellAt(e);if(c)play(c[0],c[1]);});
  cv.addEventListener('pointermove',function(e){if(demo||state!=='play'||e.pointerType==='touch')return;var c=cellAt(e);if(c)setHover(c[0],c[1]);else hoverSet=null;});
  cv.addEventListener('pointerleave',function(){hoverSet=null;});
  cv.addEventListener('contextmenu',function(e){e.preventDefault();});
  window.addEventListener('keydown',function(e){
    var k=e.key,d=k==='ArrowLeft'||k==='a'?[-1,0]:k==='ArrowRight'||k==='d'?[1,0]:k==='ArrowUp'||k==='w'?[0,-1]:k==='ArrowDown'||k==='s'?[0,1]:null;
    var go=k===' '||k==='Spacebar'||k==='Enter';
    if(k.indexOf('Arrow')===0||k===' '||k==='Spacebar')e.preventDefault();
    if(e.repeat&&go)return;
    if(demo||state!=='play'){if(go)tryStart();return;}
    if(!cursor)cursor=[COLS>>1,ROWS>>1];
    if(d){cursor[0]=clamp(cursor[0]+d[0],0,COLS-1);cursor[1]=clamp(cursor[1]+d[1],0,ROWS-1);setHover(cursor[0],cursor[1]);}
    else if(go){play(cursor[0],cursor[1]);}
  });
}
state=ATTRACT?'play':'title';
resize();resetGame();kick();
})();
</script></body></html>
