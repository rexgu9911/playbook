var AC=null,master=null,shootT=0;
function initAudio(){if(ATTRACT||AC)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0.45;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,d,type,vol,slide,when){try{var t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function noise(d,vol,fq){try{var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  var s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;g.gain.value=vol;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start();}catch(e){}}
function sfx(n){
  if(!AC||demo)return;var b=THEME===1?0.8:THEME===2?1.2:1;
  if(n==='shoot'){if(time-shootT<0.1)return;shootT=time;tone(880*b,0.07,THEME===1?'sine':'square',0.035,0.5);}
  else if(n==='hit')tone(300*b,0.06,'triangle',0.12,0.7);
  else if(n==='pop'){noise(0.12,0.22,2400);tone(240*b,0.12,'triangle',0.16,0.4);}
  else if(n==='boom'){noise(0.35,0.4,900);tone(120,0.3,'sine',0.35,0.4);}
  else if(n==='hurt'){noise(0.4,0.5,500);tone(90,0.45,'sawtooth',0.3,0.5);}
  else if(n==='power'){[0,4,7,12].forEach(function(s,i){tone(520*b*Math.pow(1.0595,s),0.16,'triangle',0.18,1,i*0.06);});}
  else if(n==='pulse'){noise(0.6,0.35,1500);tone(200,0.6,'sine',0.3,3);}
  else if(n==='wave'){tone(392*b,0.14,'triangle',0.14,1);tone(587*b,0.2,'triangle',0.14,1,0.1);}
  else if(n==='over'){noise(0.9,0.5,400);[0,-3,-7,-12].forEach(function(s,i){tone(330*Math.pow(1.0595,s),0.35,'sawtooth',0.16,0.9,i*0.16);});}
}

var rings=[];
function ring(x,z,maxR,dur,col){

  if(!r){if(rings.length>=7)return;var g=new THREE.RingGeometry(0.94,1,56);g.rotateX(-Math.PI/2);r={mesh:new THREE.Mesh(g,new THREE.MeshBasicMaterial(Object.assign({side:THREE.DoubleSide},ADD)))};scene.add(r.mesh);rings.push(r);}
  r.on=true;r.t=0;r.dur=dur;r.max=maxR;r.mesh.visible=true;r.mesh.position.set(x,0.02,z);r.mesh.material.color.setRGB(col[0],col[1],col[2]);

var pickups=[],pickPool=[],dropIn=6,pulse=null;
function spawnPickup(x,z){

  var type=(hp<MAXHP&&rnd()<0.6)||rnd()<0.4?1:0,c=type?T.acc:T.hot;m.material.color.setRGB(c[0],c[1],c[2]);m.visible=true;
  pickups.push({type:type,ang:Math.atan2(z,x),r:Math.sqrt(x*x+z*z),x:x,z:z,mesh:m,c:c,t:0});
}
function removePickup(i){var p=pickups[i];p.mesh.visible=false;pickPool.push(p.mesh);pickups.splice(i,1);}
function hitPickup(b){
  for(var i=0;i<pickups.length;i++){var p=pickups[i],dx=p.x-b.x,dz=p.z-b.z;if(dx*dx+dz*dz<1.1){
    explode(p.x,0,p.z,ATTRACT?14:24,p.c,9,1.3);ring(p.x,p.z,3,0.4,p.c);freeze=0.05;shake+=0.3;
    if(p.type===0){spreadT=9;sfx('power');popup(p.x,0.5,p.z,'SPREAD SHOT',1);}
    else{pulse={r:R_CORE};ring(0,0,13.5,0.7,T.acc);ring(0,0,11,0.8,T.core);if(hp<MAXHP)hp++;shake+=0.6;sfx('pulse');popup(p.x,0.5,p.z,'SHIELD PULSE',1);}
    removePickup(i);return true;}}

}
function onKill(e,pts){

// ---- steering: autopilot (demo) or player ----
var aiCur=null;
function aiTarget(){
  var best=null,bt=1e9,ct=1e9,i,e,t;
  for(i=0;i<enemies.length;i++){e=enemies[i];if(e.r>R_BULLET+2)continue;t=(e.r-R_CORE)/e.spd-(e.k===1?0.7:0);if(e===aiCur)ct=t;if(t<bt){bt=t;best=e;}}
  if(best&&aiCur&&ct<bt+0.6)best=aiCur;aiCur=best;
  if(pickups.length&&(!best||bt>2.6))return pickups[0].ang;
  if(!best)return null;
  return best.ang+best.av*Math.max(0,(best.r-R_ORBIT)/(26+best.spd));
}
function control(dt){

  else if(ship.dir!==0||ship.target===null)ship.v+=(ship.dir*4.8-ship.v)*Math.min(1,dt*12);
  else{d=angDiff(ship.target,ship.a);ship.v+=(clamp(d*13,-8,8)-ship.v)*Math.min(1,dt*18);}

function startGame(){

/*LOGIC*/
function update(dt){
  time+=dt;
  var i,j,e,b,p;
  if(state==='over'){overT+=dt;if(demo&&overT>1.6){resetGame();state=ATTRACT?'play':'title';}}
  else{
    control(dt);ship.a+=ship.v*dt;
    fireT-=dt;if(fireT<=0){fireT=spreadT>0?0.15:0.17;fire();}
    if(spreadT>0)spreadT-=dt;
    // waves
    if(waveLeft<=0){if(!enemies.length){waveGap-=dt;if(waveGap<=0){waveGap=1.3;nextWave();}}}
    else{spawnT-=dt;if(spawnT<=0){spawnT=Math.max(0.18,0.8-wave*0.05)*rr(0.6,1.3)*(demo?0.62:1);waveLeft--;
      var k=0,q=rnd();if(q<Math.min(0.22,0.04*(wave-1)))k=1;else if(q<Math.min(0.55,0.09*(wave-1)))k=2;
      lastAng=rnd()<Math.max(0.3,0.7-wave*0.04)?lastAng+rr(-0.7,0.7):rr(0,6.283);spawnEnemy(k,lastAng,R_SPAWN);}}
  }
  for(i=enemies.length-1;i>=0;i--){e=enemies[i];e.r-=e.spd*dt;e.ang+=e.av*dt;
    var t=clamp((e.r-8)/(R_SPAWN-8),0,1);e.x=Math.cos(e.ang)*e.r;e.z=Math.sin(e.ang)*e.r;e.y=e.y0*t*t;
    e.mesh.position.set(e.x,e.y,e.z);e.mesh.rotation.x+=e.sx*dt;e.mesh.rotation.y+=e.sy*dt;
    if(e.flash>0)e.flash=Math.max(0,e.flash-dt*7);animEnemy(e,dt);
    if(e.r<R_CORE+e.size*0.4){hitCore(i);if(state==='over')break;}}
  for(i=bullets.length-1;i>=0;i--){b=bullets[i];b.x+=b.dx*dt;b.z+=b.dz*dt;var dead=b.x*b.x+b.z*b.z>R_BULLET*R_BULLET;
    if(!dead)for(j=enemies.length-1;j>=0;j--){e=enemies[j];var dx=e.x-b.x,dz=e.z-b.z,rad=e.size+0.3;if(dx*dx+dz*dz<rad*rad&&Math.abs(e.y)<2){hurtEnemy(j,1);dead=true;break;}}
    if(!dead&&hitPickup(b))dead=true;
    if(dead){bullets[i]=bullets[bullets.length-1];bullets.pop();}}
  for(i=parts.length-1;i>=0;i--){p=parts[i];p.t+=dt;if(p.t>=p.life){parts[i]=parts[parts.length-1];parts.pop();continue;}
    var d=1-2.2*dt;p.vx*=d;p.vy*=d;p.vz*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}
  shake*=Math.pow(0.004,dt);if(coreFlash>0)coreFlash=Math.max(0,coreFlash-dt*2.5);
  updateExtras(dt);
}
function animEnemy(e){var m=e.mesh.material;m.emissive.copy(e.mesh.userData.base);if(e.flash>0)m.emissive.lerp(WHITE,e.flash);}
var WHITE=new THREE.Color(1,1,1);
function updateExtras(dt){
  var i,p;
  for(i=pickups.length-1;i>=0;i--){p=pickups[i];p.t+=dt;p.r-=1.2*dt;p.x=Math.cos(p.ang)*p.r;p.z=Math.sin(p.ang)*p.r;if(p.r<R_ORBIT+0.3||state==='over'){explode(p.x,0,p.z,6,p.c,4,0.8);removePickup(i);}}
  if(pulse){pulse.r+=19*dt;for(i=enemies.length-1;i>=0;i--)if(enemies[i].r<pulse.r)hurtEnemy(i,9);if(pulse.r>13.5)pulse=null;}
  // ambient trails
  if(state!=='over'&&rnd()<dt*40){var a=ship.a,c=Math.cos(a),s=Math.sin(a);part(c*(R_ORBIT-0.4),0,s*(R_ORBIT-0.4),-c*2-s*ship.v*0.6,rr(-0.3,0.3),-s*2+c*ship.v*0.6,0.35,0.7,spreadT>0?T.hot:T.acc);}
  if(THEME===2||!ATTRACT)for(i=0;i<enemies.length;i++){p=enemies[i];if(rnd()<dt*(THEME===2?14:5))part(p.x,p.y,p.z,rr(-0.4,0.4),rr(-0.4,0.4),rr(-0.4,0.4),THEME===2?0.5:0.7,p.size*(THEME===2?1.5:0.9),THEME===0?T.core:T.en);}
}
function render(dt){
  var i,p,k;gN=0;
  camAz+=dt*0.07;
  var ce=Math.cos(EL),sx=(rnd()-0.5)*shake,sy=(rnd()-0.5)*shake;
  camera.position.set(Math.cos(camAz)*camDist*ce+sx,camDist*Math.sin(EL)+sy,Math.sin(camAz)*camDist*ce+sx);camera.lookAt(0,-0.4,0);
  var alive=state!=='over';
  shipMesh.visible=alive;coreMesh.visible=alive;
  shipMesh.position.set(Math.cos(ship.a)*R_ORBIT,0,Math.sin(ship.a)*R_ORBIT);shipMesh.rotation.set(clamp(ship.v*0.16,-0.8,0.8),-ship.a,0);
  coreFx(dt);
  var hpK=alive?0.45+0.55*hp/MAXHP:0,pulse=1+Math.sin(time*(THEME===1?5:2.2))*0.06;
  glowA.material.opacity=(0.38*hpK+coreFlash*0.5)*pulse;glowA.scale.setScalar(8.5*pulse+coreFlash*5);glowB.material.opacity=(THEME===1?0.16:0.55)*hpK;
  glowA.material.color.setRGB(T.core[0]+coreFlash,T.core[1]*(1-coreFlash*0.7),T.core[2]*(1-coreFlash*0.7));
  coreLight.intensity=26*hpK+coreFlash*50;
  if(alive)gp(shipMesh.position.x,0,shipMesh.position.z,1.6,spreadT>0?T.hot:T.bul,0.8);
  for(i=0;i<bullets.length;i++){p=bullets[i];gp(p.x,0,p.z,1.5,T.bul,1);gp(p.x,0,p.z,0.6,[1,1,1],1);gp(p.x-p.dx*0.014,0,p.z-p.dz*0.014,0.6,T.bul,0.6);gp(p.x-p.dx*0.028,0,p.z-p.dz*0.028,0.4,T.bul,0.35);}
  for(i=0;i<enemies.length;i++){p=enemies[i];gp(p.x,p.y,p.z,p.size*(THEME===2?4.2:2.6),THEME===0?T.core:T.en,(THEME===2?0.5:0.22)+p.flash*0.6);}
  for(i=0;i<parts.length;i++){p=parts[i];k=1-p.t/p.life;gp(p.x,p.y,p.z,p.s*(0.4+k*0.6),p.c,k*1.2);}
  renderExtras(dt);
  gGeo.attributes.position.needsUpdate=true;gGeo.attributes.col.needsUpdate=true;gGeo.attributes.size.needsUpdate=true;gGeo.setDrawRange(0,gN);
  renderer.render(scene,camera);
}
function renderExtras(dt){
  var i,r,p,k;
  for(i=0;i<rings.length;i++){r=rings[i];if(!r.on)continue;r.t+=dt/r.dur;if(r.t>=1){r.on=false;r.mesh.visible=false;continue;}
    k=1-Math.pow(1-r.t,3);r.mesh.scale.setScalar(Math.max(0.01,r.max*k));r.mesh.material.opacity=(1-r.t)*0.9;}
  for(i=0;i<pickups.length;i++){p=pickups[i];k=1+Math.sin(time*7+i)*0.15;p.mesh.position.set(p.x,Math.sin(time*3+i)*0.15,p.z);p.mesh.rotation.y+=dt*3;p.mesh.rotation.x+=dt*1.7;p.mesh.scale.setScalar(k);
    gp(p.x,0,p.z,3.4*k,p.c,0.7);gp(p.x,0,p.z,1.2,[1,1,1],0.8);}
  if(start.stars)start.stars.rotation.y+=dt*0.004;
  hud(dt);
}
/*EXTRAS*/
var last=0,raf=0;
function frame(ts){
  raf=0;if(document.hidden)return;
  var dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  var sdt=dt;if(freeze>0){freeze-=dt;sdt=0;}
  try{if(sdt>0)update(sdt);render(dt);}catch(e){if(window.console)console.warn(e);}
  raf=requestAnimationFrame(frame);
}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',kick);
function resize(){
  W=Math.max(120,window.innerWidth||320);H=Math.max(100,window.innerHeight||200);DPR=Math.min(ATTRACT?1.5:2,window.devicePixelRatio||1);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  var asp=W/H,th=Math.tan(25*Math.PI/180);EL=asp<1?1.2:0.92;camera.aspect=asp;camera.updateProjectionMatrix();
  var Rh=asp<1?7:9.5,dH=Rh/(th*asp),dV=9.5*Math.sin(EL)/th*1.08;camDist=Math.max(dH,dV)*(ATTRACT?0.86:1);
  gMat.uniforms.scale.value=H*DPR*0.5/th;
}
window.addEventListener('resize',resize);
if(!ATTRACT){
  var keys={l:0,r:0},ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),ndc=new THREE.Vector2(),hitP=new THREE.Vector3();
  var aim=function(e){var b=cv.getBoundingClientRect();ndc.set((e.clientX-b.left)/Math.max(1,b.width)*2-1,-((e.clientY-b.top)/Math.max(1,b.height)*2-1));
    ray.setFromCamera(ndc,camera);if(ray.ray.intersectPlane(plane,hitP)&&hitP.x*hitP.x+hitP.z*hitP.z>0.2)ship.target=Math.atan2(hitP.z,hitP.x);};
  var tryStart=function(){if(demo||state==='title'||(state==='over'&&overT>1)){startGame();return true;}return false;};
  window.addEventListener('pointerdown',function(e){e.preventDefault();if(!tryStart())aim(e);else aim(e);});
  window.addEventListener('pointermove',function(e){if(state==='play'&&!demo&&(e.pointerType!=='touch'||e.buttons))aim(e);});
  window.addEventListener('contextmenu',function(e){e.preventDefault();});
  var key=function(e,d){var k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'||k===' '||k==='Spacebar')e.preventDefault();
    if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=d;if(d)ship.target=null;}
    else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=d;if(d)ship.target=null;}
    else if(d&&!e.repeat&&(k===' '||k==='Spacebar'||k==='Enter'))tryStart();
    ship.dir=keys.r-keys.l;};
  window.addEventListener('keydown',function(e){key(e,1);});window.addEventListener('keyup',function(e){key(e,0);});
  window.addEventListener('blur',function(){keys.l=keys.r=0;ship.dir=0;});
}
state=ATTRACT?'play':'title';
resize();resetGame();kick();
}
})();
</script></body></html>
