<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screen Transition</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K = {
  COVER_TIME: 0.55,      // s from first frame to full cover
  HOLD_TIME: 0.28,       // s held at full cover (scene swaps at the start of the hold)
  REVEAL_TIME: 0.55,     // s from full cover to fully revealed
  IRIS_POWER: 3,         // iris: ease-in exponent closing, mirrored ease-out opening
  WIPE_POWER: 2,         // diagonal: ease-in-out exponent, both halves
  PIXEL_POWER: 1,        // dissolve: curve exponent (1 = linear, cells flip at a steady rate)
  IRIS_RING: 2,          // px accent ring drawn on the iris edge
  DIAG_SLANT: 110,       // px horizontal offset between the top and bottom of the wipe edge
  DIAG_STRIPE: 8,        // px accent stripe on the wipe's leading edge
  PIXEL_SIZE: 20,        // px dissolve cell size
  PIXEL_FLASH: 0.1,      // 0-1 progress window in which freshly flipped cells show the accent
  SCENE_DWELL: 1.2,      // s the demo rests on a scene before the next transition
  ATTRACT_IDLE: 3.5,     // s after user input before attract mode resumes
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const FONT='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- mechanic ----
// A transition has three phases: cover (old scene disappears), hold (full cover, swap scenes), reveal.
const COVER='#050507';
const easeIn=(k,p)=>Math.pow(k,p),easeOut=(k,p)=>1-Math.pow(1-k,p);
const easeInOut=(k,p)=>k<0.5?Math.pow(2*k,p)/2:1-Math.pow(2-2*k,p)/2;
const TRANSITIONS={   // cover/reveal map phase time 0..1 to progress 0..1
  iris:    {name:'IRIS',          cover:k=>easeIn(k,K.IRIS_POWER),    reveal:k=>easeOut(k,K.IRIS_POWER)},
  diagonal:{name:'DIAGONAL WIPE', cover:k=>easeInOut(k,K.WIPE_POWER), reveal:k=>easeInOut(k,K.WIPE_POWER)},
  pixel:   {name:'PIXEL DISSOLVE',cover:k=>easeIn(k,K.PIXEL_POWER),   reveal:k=>easeIn(k,K.PIXEL_POWER)},
};
let tr=null;          // active transition {type, phase, t, onSwap, order}
function startTransition(type,onSwap){
  if(tr)return false;
  tr={type,phase:'cover',t:0,onSwap,order:null};
  return true;
}
function stepTransition(dt){
  if(!tr)return;
  tr.t+=dt;
  if(tr.phase==='cover'&&tr.t>=K.COVER_TIME){tr.phase='hold';tr.t=0;if(tr.onSwap)tr.onSwap();}  // swap while fully hidden
  else if(tr.phase==='hold'&&tr.t>=K.HOLD_TIME){tr.phase='reveal';tr.t=0;}
  else if(tr.phase==='reveal'&&tr.t>=K.REVEAL_TIME)tr=null;
}
function coverAmount(){   // 0 = scene fully visible, 1 = fully covered
  if(!tr)return 0;const d=TRANSITIONS[tr.type];
  if(tr.phase==='cover')return d.cover(clamp(tr.t/K.COVER_TIME,0,1));
  if(tr.phase==='hold')return 1;
  return 1-d.reveal(clamp(tr.t/K.REVEAL_TIME,0,1));
}
function drawCover(fx,fy){          // (fx,fy) = iris focal point in the current scene
  if(!tr)return;
  const c=coverAmount(),moving=tr.phase!=='hold';
  ctx.fillStyle=COVER;
  if(tr.type==='iris'){
    const R=Math.hypot(Math.max(fx,VW-fx),Math.max(fy,VH-fy))+K.IRIS_RING,r=R*(1-c);
    ctx.beginPath();ctx.rect(-1,-1,VW+2,VH+2);
    if(r>0.5){ctx.moveTo(fx+r,fy);ctx.arc(fx,fy,r,0,6.283,true);}   // hole in the cover
    ctx.fill('evenodd');
    if(r>0.5&&moving){ctx.strokeStyle=C.a;ctx.lineWidth=K.IRIS_RING;ctx.beginPath();ctx.arc(fx,fy,r,0,6.283);ctx.stroke();}
  }else if(tr.type==='diagonal'){
    // edge runs from (e+SLANT, top) to (e, bottom); covering grows left of it, revealing shrinks right of it
    const sl=K.DIAG_SLANT,travel=VW+sl,cov=tr.phase==='cover';
    const e=-sl+travel*(cov?c:1-c),st=cov?-K.DIAG_STRIPE:K.DIAG_STRIPE;
    const quad=(a,b)=>{ctx.beginPath();ctx.moveTo(a+sl,-1);ctx.lineTo(b+sl,-1);ctx.lineTo(b,VH+1);ctx.lineTo(a,VH+1);ctx.closePath();ctx.fill();};
    if(!moving)ctx.fillRect(-1,-1,VW+2,VH+2);
    else if(cov)quad(-sl-1,e);else quad(e,VW+1);
    if(moving&&c>0&&c<1){ctx.fillStyle=C.a;quad(Math.min(e,e+st),Math.max(e,e+st));}   // leading-edge stripe
  }else{
    const s=K.PIXEL_SIZE,cols=Math.ceil(VW/s),rows=Math.ceil(VH/s),n=cols*rows;
    if(!tr.order||tr.order.length!==n){tr.order=new Float32Array(n);for(let i=0;i<n;i++)tr.order[i]=Math.random();}  // flip threshold per cell
    for(let i=0;i<n;i++){
      const th=tr.order[i];if(th>=c)continue;
      const x=(i%cols)*s,y=((i/cols)|0)*s;
      ctx.fillStyle=COVER;ctx.fillRect(x,y,s+0.5,s+0.5);
      // cells near the moving threshold flash the accent; faded out near full cover so the hold stays clean
      const fa=moving?(1-(c-th)/K.PIXEL_FLASH)*clamp((1-c)/K.PIXEL_FLASH,0,1):0;
      if(fa>0){ctx.globalAlpha=fa;ctx.fillStyle=C.a;ctx.fillRect(x+1,y+1,s-2,s-2);ctx.globalAlpha=1;}
    }
  }
  if(c>=0.999){ctx.font='700 11px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.mu;
    ctx.fillText(TRANSITIONS[tr.type].name,VW/2,VH/2);}
}

// ---- demo ----
const TYPES=['iris','diagonal','pixel'];
let scene=0,next=0,shown='iris',autoT=0.3,userT=0;
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;
}
addEventListener('resize',resize);resize();
function focal(){return scene===0?[VW*0.66,VH*0.36]:[VW*0.3,VH*0.72-9];}
function go(type){if(startTransition(type,()=>{scene=1-scene;})){shown=type;autoT=K.SCENE_DWELL;}}
function drawScene(){
  const label=(t)=>{ctx.font='800 12px '+FONT;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=C.ink;ctx.fillText(t,20,24);};
  if(scene===0){
    ctx.fillStyle='#141419';ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#202028';for(let x=10;x<VW;x+=20)for(let y=10;y<VH*0.6;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
    const [mx,my]=focal();ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(mx,my,30,0,6.283);ctx.fill();
    ctx.fillStyle='#D9D5CC';ctx.beginPath();ctx.arc(mx-9,my-6,6,0,6.283);ctx.arc(mx+10,my+9,4,0,6.283);ctx.fill();
    ctx.fillStyle='#1E1E25';ctx.beginPath();ctx.moveTo(0,VH);
    for(let x=0;x<=VW+20;x+=20)ctx.lineTo(x,VH*0.68+Math.sin(x*0.018)*18+Math.sin(x*0.05)*6);
    ctx.lineTo(VW,VH);ctx.closePath();ctx.fill();label('SCENE A');
  }else{
    const gy=VH*0.72;ctx.fillStyle=C.bg;ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(VW,gy);ctx.stroke();
    ctx.strokeStyle=C.mu;for(let x=0;x<VW;x+=24)ctx.strokeRect(x,gy+1,24,14);
    const px=VW*0.55,py=gy-58;ctx.strokeStyle=C.ink;ctx.strokeRect(px,py,96,12);
    ctx.fillStyle=C.y;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(px+24+i*24,py-14,3.5,0,6.283);ctx.fill();}
    const [hx,hy]=focal();ctx.fillStyle=C.a;ctx.fillRect(hx-8,hy-8,16,16);ctx.fillStyle=C.ink;ctx.fillRect(hx+1,hy-4,2,4);ctx.fillRect(hx+5,hy-4,2,4);
    label('SCENE B');
  }
}
function drawCurve(){                // the active easing curve with a dot at the current progress
  const d=TRANSITIONS[shown],x0=20,y0=VH-62,w=56,h=30;
  const ph=tr?tr.phase:'cover',f=ph==='reveal'?d.reveal:d.cover;
  const k=!tr?1:ph==='hold'?1:clamp(tr.t/(ph==='cover'?K.COVER_TIME:K.REVEAL_TIME),0,1);
  ctx.fillStyle='rgba(13,13,16,.75)';ctx.fillRect(x0-6,y0-20,w+12,h+26);
  ctx.font='700 8px '+FONT;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=C.mu;
  ctx.fillText(d.name+' · '+(tr?ph.toUpperCase():'IDLE'),x0,y0-11);
  ctx.strokeStyle='#2A2A32';ctx.lineWidth=1;ctx.strokeRect(x0,y0,w,h);
  ctx.strokeStyle=C.mu;ctx.lineWidth=1.3;ctx.beginPath();
  for(let i=0;i<=24;i++){const u=i/24;ctx.lineTo(x0+u*w,y0+h-f(u)*h);}ctx.stroke();
  if(tr){ctx.fillStyle=C.y;ctx.beginPath();ctx.arc(x0+k*w,y0+h-f(k)*h,2.6,0,6.283);ctx.fill();}
}
function update(dt){
  if(userT>0)userT-=dt;
  else if(!tr){autoT-=dt;if(autoT<=0){go(TYPES[next]);next=(next+1)%TYPES.length;}}
  stepTransition(dt);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  drawScene();const [fx,fy]=focal();drawCover(fx,fy);drawCurve();
  ctx.font='10px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.mu;
  ctx.fillText('Click for next · 1 iris · 2 diagonal · 3 dissolve',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  update(dt);draw();
}
function user(type){userT=K.ATTRACT_IDLE;if(!tr){if(!type){type=TYPES[next];next=(next+1)%TYPES.length;}go(type);}}
cv.addEventListener('pointerdown',e=>{user();e.preventDefault();});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.key==='1'||e.key==='2'||e.key==='3')user(TYPES[+e.key-1]);
  else if(e.key===' '||e.key==='Enter')user();
});
requestAnimationFrame(frame);
})();
</script></body></html>
