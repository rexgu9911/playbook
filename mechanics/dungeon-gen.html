<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Generator</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K = {
  GRID_W: 60,            // cells map width
  GRID_H: 36,            // cells map height
  CELL: 6,               // px per cell on screen
  MAX_ROOMS: 12,         // stop placing once this many rooms fit
  ROOM_ATTEMPTS: 80,     // random placements tried (overlapping ones are rejected)
  ROOM_MIN: 4,           // cells min room side
  ROOM_MAX: 10,          // cells max room side
  ROOM_PAD: 2,           // cells of wall kept between rooms
  LOOP_CHANCE: 0.15,     // 0-1 chance a short non-tree edge is added (creates loops)
  LOOP_MAX_DIST: 18,     // cells max centre distance for a loop edge
  ATTEMPT_STEP: 0.03,    // s per placement attempt in the playback
  EDGE_STEP: 0.12,       // s per connection in the playback
  CARVE_RATE: 360,       // cells/s corridor carving speed in the playback
  REJECT_SHOW: 0.25,     // s a rejected placement stays visible
  DONE_HOLD: 1.8,        // s the finished map is held before the next seed
  ATTRACT_IDLE: 3.5,     // s after user input before attract mode resumes
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const FONT='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;

// ---- mechanic ----
// Seeded PRNG: same seed -> same sequence -> same dungeon. Never use Math.random() inside generate().
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function generate(seed){
  const rng=mulberry32(seed),ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
  const GW=K.GRID_W,grid=new Uint8Array(GW*K.GRID_H);   // 0 wall, 1 room, 2 corridor
  const rooms=[],attempts=[],edges=[];
  // 1) random rooms: try a placement, keep it only if it clears every room by ROOM_PAD
  for(let i=0;i<K.ROOM_ATTEMPTS&&rooms.length<K.MAX_ROOMS;i++){
    const w=ri(K.ROOM_MIN,K.ROOM_MAX),h=ri(K.ROOM_MIN,K.ROOM_MAX);
    const x=ri(1,GW-w-1),y=ri(1,K.GRID_H-h-1),p=K.ROOM_PAD;
    const ok=rooms.every(r=>x>=r.x+r.w+p||x+w+p<=r.x||y>=r.y+r.h+p||y+h+p<=r.y);
    const room={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)};
    attempts.push({room,ok});
    if(ok){rooms.push(room);for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)grid[yy*GW+xx]=1;}
  }
  // 2) minimum spanning tree over room centres (Prim): every room reachable, no redundant links
  const n=rooms.length,dist=(a,b)=>Math.hypot(rooms[a].cx-rooms[b].cx,rooms[a].cy-rooms[b].cy);
  const inTree=[0],linked=new Set();
  while(inTree.length<n){
    let best=null;
    for(const i of inTree)for(let j=0;j<n;j++){if(inTree.includes(j))continue;const d=dist(i,j);if(!best||d<best.d)best={a:i,b:j,d};}
    inTree.push(best.b);edges.push({a:best.a,b:best.b,loop:false});linked.add(Math.min(best.a,best.b)+','+Math.max(best.a,best.b));
  }
  // a few extra short edges so the map has loops instead of pure dead ends
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)
    if(!linked.has(i+','+j)&&dist(i,j)<K.LOOP_MAX_DIST&&rng()<K.LOOP_CHANCE)edges.push({a:i,b:j,loop:true});
  // 3) carve an L-shaped corridor per edge (random elbow side); only wall cells are recorded
  for(const e of edges){
    const A=rooms[e.a],B=rooms[e.b],pts=rng()<0.5?[[B.cx,A.cy],[B.cx,B.cy]]:[[A.cx,B.cy],[B.cx,B.cy]];
    let x=A.cx,y=A.cy;e.cells=[];
    for(const [tx,ty] of pts)while(x!==tx||y!==ty){
      x+=Math.sign(tx-x);y+=Math.sign(ty-y);const k=y*GW+x;
      if(grid[k]===0){grid[k]=2;e.cells.push(k);}
    }
  }
  // start / exit = the two rooms furthest apart
  let start=0,exit=0,far=-1;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const d=dist(i,j);if(d>far){far=d;start=i;exit=j;}}
  return {seed,rooms,attempts,edges,grid,start,exit};
}
// Step-by-step playback: time t maps onto attempts -> edges -> carved cells.
function playback(g,t){
  const tA=g.attempts.length*K.ATTEMPT_STEP,tE=g.edges.length*K.EDGE_STEP;
  const cells=g.edges.reduce((s,e)=>s+e.cells.length,0),tC=cells/K.CARVE_RATE;
  return {tA,tE,cells,total:tA+tE+tC,
    attempts:Math.min(g.attempts.length,Math.floor(t/K.ATTEMPT_STEP)),
    edges:t<tA?0:Math.min(g.edges.length,Math.floor((t-tA)/K.EDGE_STEP)+1),
    carved:t<tA+tE?0:Math.min(cells,Math.floor((t-tA-tE)*K.CARVE_RATE))};
}
function drawDungeon(g,t,ox,oy){
  const cs=K.CELL,GW=K.GRID_W,pb=playback(g,t),done=t>=pb.total;
  ctx.fillStyle=C.dot;for(let y=0;y<K.GRID_H;y++)for(let x=0;x<GW;x++)ctx.fillRect(ox+x*cs+cs/2-0.75,oy+y*cs+cs/2-0.75,1.5,1.5);
  ctx.strokeStyle='#26262E';ctx.lineWidth=1;ctx.strokeRect(ox-0.5,oy-0.5,GW*cs+1,K.GRID_H*cs+1);
  // corridors: carved cells in order, newest cell in accent
  let k=0;const carving=pb.carved>0&&!done;
  for(const e of g.edges)for(const c of e.cells){
    if(k>=pb.carved)break;k++;
    ctx.fillStyle=carving&&k===pb.carved?C.a:C.mu;ctx.fillRect(ox+(c%GW)*cs,oy+((c/GW)|0)*cs,cs,cs);
  }
  // rooms (pop in) and recently rejected attempts (dashed accent)
  for(let i=0;i<pb.attempts;i++){
    const {room:r,ok}=g.attempts[i],age=t-(i+1)*K.ATTEMPT_STEP;
    if(ok){
      const s=Math.min(1,age/0.15),e=1+2.2*Math.pow(s-1,3)+1.2*Math.pow(s-1,2);   // ease-out-back pop
      const w=r.w*cs*e,h=r.h*cs*e,x=ox+(r.x+r.w/2)*cs-w/2,y=oy+(r.y+r.h/2)*cs-h/2;
      ctx.fillStyle='#24242B';ctx.fillRect(x,y,w,h);ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    }else if(age<K.REJECT_SHOW){
      ctx.globalAlpha=1-age/K.REJECT_SHOW;ctx.setLineDash([3,2]);ctx.strokeStyle=C.a;ctx.lineWidth=1;
      ctx.strokeRect(ox+r.x*cs+0.5,oy+r.y*cs+0.5,r.w*cs-1,r.h*cs-1);ctx.setLineDash([]);ctx.globalAlpha=1;
    }
  }
  // connection graph: tree edges solid, loop edges dashed yellow; dims once carving starts
  const dim=t>=pb.tA+pb.tE;
  for(let i=0;i<pb.edges;i++){
    const e=g.edges[i],A=g.rooms[e.a],B=g.rooms[e.b];
    ctx.globalAlpha=dim?0.25:1;ctx.strokeStyle=e.loop?C.y:C.a;ctx.lineWidth=1.3;ctx.setLineDash(e.loop?[3,3]:[]);
    ctx.beginPath();ctx.moveTo(ox+(A.cx+0.5)*cs,oy+(A.cy+0.5)*cs);ctx.lineTo(ox+(B.cx+0.5)*cs,oy+(B.cy+0.5)*cs);ctx.stroke();
  }
  ctx.setLineDash([]);ctx.globalAlpha=1;
  if(done&&g.rooms.length>1){
    const s=g.rooms[g.start],x=g.rooms[g.exit];
    ctx.fillStyle=C.y;ctx.beginPath();ctx.arc(ox+(s.cx+0.5)*cs,oy+(s.cy+0.5)*cs,4,0,6.283);ctx.fill();
    ctx.fillStyle=C.a;ctx.fillRect(ox+(x.cx+0.5)*cs-4,oy+(x.cy+0.5)*cs-4,8,8);
  }
  return pb;
}

// ---- demo ----
let gen=null,t=0,hold=0,userT=0;
function newMap(seed){gen=generate(seed);t=0;hold=0;}
newMap(1+Math.floor(Math.random()*99999));
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;
}
addEventListener('resize',resize);resize();
function update(dt){
  if(userT>0)userT-=dt;
  t+=dt;const pb=playback(gen,t);
  if(t>=pb.total){hold+=dt;if(hold>=K.DONE_HOLD&&userT<=0)newMap(1+Math.floor(Math.random()*99999));}
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  const gw=K.GRID_W*K.CELL,gh=K.GRID_H*K.CELL,ox=Math.round(VW/2-gw/2),oy=Math.round(VH/2-gh/2+2);
  const pb=drawDungeon(gen,t,ox,oy);
  const placed=gen.attempts.slice(0,pb.attempts).filter(a=>a.ok).length,loops=gen.edges.filter(e=>e.loop).length;
  const status=t<pb.tA?'placing rooms '+placed+' · attempt '+pb.attempts+'/'+gen.attempts.length
    :t<pb.tA+pb.tE?'connecting (MST + loops) '+pb.edges+'/'+gen.edges.length
    :t<pb.total?'carving corridors '+Math.round(pb.carved/Math.max(1,pb.cells)*100)+'%'
    :'done · '+gen.rooms.length+' rooms · '+loops+' loop'+(loops===1?'':'s');
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 10px '+FONT;ctx.fillStyle=C.ink;
  ctx.fillText('SEED '+gen.seed,ox,oy-12);
  ctx.textAlign='right';ctx.font='10px '+FONT;ctx.fillStyle=C.mu;ctx.fillText(status,ox+gw,oy-12);
  ctx.textAlign='center';ctx.fillText('Click for a new seed · R replays the same seed',VW/2,VH-12);
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  update(dt);draw();
}
cv.addEventListener('pointerdown',e=>{userT=K.ATTRACT_IDLE;newMap(1+Math.floor(Math.random()*99999));e.preventDefault();});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.key==='r'||e.key==='R'){userT=K.ATTRACT_IDLE;newMap(gen.seed);}   // same seed -> identical map
  else if(e.key===' '||e.key==='Enter'){userT=K.ATTRACT_IDLE;newMap(1+Math.floor(Math.random()*99999));}
});
requestAnimationFrame(frame);
})();
</script></body></html>
