<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wall Slide &amp; Jump</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K={
  GRAVITY: 1400,          // px/s² downward acceleration
  MAX_FALL: 620,          // px/s terminal fall speed in open air
  RUN_SPEED: 150,         // px/s top horizontal speed from input
  GROUND_ACCEL: 1800,     // px/s² horizontal accel/brake on the ground
  AIR_ACCEL: 1000,        // px/s² horizontal accel in the air
  AIR_DRAG: 120,          // px/s² horizontal slowdown in the air with no input
  JUMP_SPEED: 430,        // px/s upward launch of a normal ground jump
  WALL_SLIDE_SPEED: 90,   // px/s max fall speed while touching a wall
  WALL_FRICTION: 1800,    // px/s² braking when hitting a wall faster than the slide cap (no hard snap)
  WALL_JUMP_X: 230,       // px/s horizontal kick away from the wall
  WALL_JUMP_Y: 440,       // px/s upward speed of a wall jump
  WALL_JUMP_LOCK: 0.14,   // s horizontal input is ignored after a wall jump
  WALL_COYOTE: 0.08,      // s after leaving a wall when a wall jump still works
  JUMP_BUFFER: 0.10,      // s a jump press is remembered before touching ground or wall
  DUST_RATE: 28,          // particles/s spawned at the hand while sliding
  MAX_PARTICLES: 60,      // particle cap
  BODY_W: 16,             // px collision width
  BODY_H: 20,             // px collision height
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280,GY=244,WL=155,WR=285,CEIL=6;
function layout(){GY=VH-36;WL=VW/2-65;WR=VW/2+65;}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const approach=(v,target,step)=>v<target?Math.min(v+step,target):Math.max(v-step,target);

// ---- mechanic ----
const p={x:VW/2,y:GY,vx:0,vy:0,face:1,ground:true,wall:0,lastWall:0,wallCoyote:0,buffer:0,lock:0,sliding:false,sx:1,sy:1,dustAcc:0};
const input={dir:0,jumpPressed:false};   // dir: -1/0/1, jumpPressed: set on the press frame
let parts=[];

function wallContact(){ // -1 = touching a wall on the left, +1 = on the right, 0 = none
  if(p.x-K.BODY_W/2<=WL+0.5)return -1;
  if(p.x+K.BODY_W/2>=WR-0.5)return 1;
  return 0;
}
function dust(x,y,n,pushX,col){
  for(let i=0;i<n&&parts.length<K.MAX_PARTICLES;i++)
    parts.push({x,y:y+(Math.random()-0.5)*4,vx:pushX*(20+Math.random()*50)+(Math.random()-0.5)*20,vy:-10-Math.random()*30,life:0,max:0.3+Math.random()*0.3,r:1.2+Math.random()*2,col:col||C.mu});
}
function step(dt){
  // horizontal: input is ignored during the wall-jump lock so the kick can't be steered back into the wall
  p.lock=Math.max(0,p.lock-dt);
  const dir=p.lock>0?0:input.dir;
  if(dir){p.face=dir;p.vx=approach(p.vx,dir*K.RUN_SPEED,(p.ground?K.GROUND_ACCEL:K.AIR_ACCEL)*dt);}
  else if(p.ground)p.vx=approach(p.vx,0,K.GROUND_ACCEL*dt);
  else if(p.lock<=0)p.vx=approach(p.vx,0,K.AIR_DRAG*dt);

  // gravity, or the wall-slide cap while falling against a wall
  const prevWall=p.wall;
  p.wall=p.ground?0:wallContact();
  p.sliding=p.wall!==0&&p.vy>0;
  if(!p.sliding)p.vy=Math.min(K.MAX_FALL,p.vy+K.GRAVITY*dt);
  else if(p.vy<=K.WALL_SLIDE_SPEED)p.vy=Math.min(K.WALL_SLIDE_SPEED,p.vy+K.GRAVITY*dt);
  else p.vy=Math.max(K.WALL_SLIDE_SPEED,p.vy-K.WALL_FRICTION*dt);   // came in fast: brake down to the cap
  if(p.wall){p.lastWall=p.wall;p.wallCoyote=K.WALL_COYOTE;}else p.wallCoyote=Math.max(0,p.wallCoyote-dt);
  if(p.wall&&!prevWall){p.sx=0.8;p.sy=1.12;}                       // little squish on hitting the wall

  // jump (buffered): ground jump first, otherwise wall jump if touching / just left a wall
  p.buffer=input.jumpPressed?K.JUMP_BUFFER:Math.max(0,p.buffer-dt);input.jumpPressed=false;
  if(p.buffer>0){
    if(p.ground){
      p.vy=-K.JUMP_SPEED;p.ground=false;p.buffer=0;p.sx=0.75;p.sy=1.3;
      dust(p.x,p.y,5,0,C.ink);sfx(330);
    }else if(p.wallCoyote>0){
      const away=-p.lastWall;
      p.vx=away*K.WALL_JUMP_X;p.vy=-K.WALL_JUMP_Y;p.lock=K.WALL_JUMP_LOCK;p.face=away;
      p.buffer=0;p.wallCoyote=0;p.sliding=false;p.sx=0.7;p.sy=1.35;
      dust(p.x-away*K.BODY_W/2,p.y-K.BODY_H*0.5,7,away,C.ink);sfx(520);
    }
  }

  // dust trickles from the hand while sliding, faster the closer we are to the cap
  if(p.sliding){
    p.face=-p.wall;                                               // look away from the wall
    p.dustAcc+=K.DUST_RATE*dt*Math.min(1,p.vy/K.WALL_SLIDE_SPEED);
    while(p.dustAcc>=1){p.dustAcc--;dust(p.x+p.wall*K.BODY_W/2,p.y-K.BODY_H*0.7,1,-p.wall);}
  }else p.dustAcc=0;

  // integrate + collide (walls, floor, ceiling)
  p.x+=p.vx*dt;
  if(p.x-K.BODY_W/2<WL){p.x=WL+K.BODY_W/2;if(p.vx<0)p.vx=0;}
  if(p.x+K.BODY_W/2>WR){p.x=WR-K.BODY_W/2;if(p.vx>0)p.vx=0;}
  const wasGround=p.ground;
  p.y+=p.vy*dt;
  if(p.y>=GY){
    if(!wasGround){const k=Math.min(1,p.vy/500);p.sx=1+0.35*k;p.sy=1-0.3*k;dust(p.x,GY,3+Math.round(k*4),0,C.ink);sfx(160);}
    p.y=GY;p.vy=0;p.ground=true;
  }else p.ground=false;
  if(p.y-K.BODY_H<CEIL){p.y=CEIL+K.BODY_H;if(p.vy<0)p.vy=0;}
  if(!isFinite(p.x+p.y+p.vx+p.vy)){p.x=VW/2;p.y=GY;p.vx=p.vy=0;}

  // cosmetic squash spring back to 1
  const e=Math.min(1,dt*12);p.sx+=(1-p.sx)*e;p.sy+=(1-p.sy)*e;
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-Math.min(1,dt*4);q.vy+=60*dt;}
  parts=parts.filter(q=>q.life<q.max);
}
function drawPlayer(){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.sliding)ctx.rotate(-p.wall*0.06);                         // lean off the wall while sliding
  ctx.scale(p.sx,p.sy);
  rr(-K.BODY_W/2,-K.BODY_H,K.BODY_W,K.BODY_H,6);ctx.fillStyle=C.a;ctx.fill();
  ctx.fillStyle=C.ink;const ex=p.face*2.5;
  rr(ex-5,-K.BODY_H+6,3,4.5,1.5);ctx.fill();rr(ex+2,-K.BODY_H+6,3,4.5,1.5);ctx.fill();
  if(p.sliding){rr(p.wall*K.BODY_W/2-2,-K.BODY_H*0.8,4,6,2);ctx.fill();}  // hand pressed on the wall
  ctx.restore();
}

// ---- demo ----
const keys={},ptr={down:false,x:0};
let userT=0,AC=null;
const ai={phase:'ground',t:0.3,side:-1,slide:0,pause:0.12,phaseT:0,touched:false};
function sfx(f){
  if(!AC||userT<=0)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.6,t+0.08);
  g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+0.1);
}
function autopilot(dt){
  input.dir=0;ai.phaseT+=dt;
  if(ai.phaseT>9){ai.phase='descend';ai.phaseT=0;}                  // failsafe
  if(ai.phase==='ground'){
    if(!p.ground)return;
    ai.t-=dt;
    if(ai.t<=0){input.jumpPressed=true;ai.phase='climb';ai.phaseT=0;ai.side=p.x<VW/2?-1:1;ai.touched=false;}
  }else if(ai.phase==='climb'){
    if(p.wall)ai.touched=true;else if(!ai.touched)input.dir=ai.side;  // first hop: steer into the nearer wall
    if(p.sliding){ai.slide+=dt;if(ai.slide>=ai.pause){input.jumpPressed=true;ai.slide=0;ai.pause=0.06+Math.random()*0.12;}}
    if(p.y-K.BODY_H<CEIL+46||(p.ground&&ai.phaseT>0.5)){ai.phase='descend';ai.phaseT=0;}
  }else if(p.ground){ai.phase='ground';ai.t=0.7;ai.phaseT=0;}
}
function update(dt){
  if(userT>0){
    userT-=dt;
    let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
    if(ptr.down&&Math.abs(ptr.x-p.x)>14)dir=Math.sign(ptr.x-p.x);
    input.dir=dir;if(dir||ptr.down)userT=Math.max(userT,3.5);
    if(userT<=0){ai.phase=p.ground?'ground':'descend';ai.t=0.4;ai.phaseT=0;}
  }else autopilot(dt);
  step(dt);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  // walls with a brick pattern, floor
  ctx.fillStyle='#131317';ctx.fillRect(0,0,WL,GY);ctx.fillRect(WR,0,VW-WR,GY);ctx.fillRect(0,GY,VW,VH-GY);
  ctx.strokeStyle=C.dot;ctx.lineWidth=1;ctx.beginPath();
  for(let y=GY-22,r=0;y>-22;y-=22,r++){ctx.moveTo(0,y);ctx.lineTo(WL,y);ctx.moveTo(WR,y);ctx.lineTo(VW,y);
    for(let x=WL-(r%2?18:36);x>0;x-=36){ctx.moveTo(x,y);ctx.lineTo(x,y+22);}
    for(let x=WR+(r%2?18:36);x<VW;x+=36){ctx.moveTo(x,y);ctx.lineTo(x,y+22);}}
  ctx.stroke();
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(WL,0);ctx.lineTo(WL,GY);ctx.lineTo(WR,GY);ctx.lineTo(WR,0);ctx.moveTo(0,GY);ctx.lineTo(WL,GY);ctx.moveTo(WR,GY);ctx.lineTo(VW,GY);ctx.stroke();
  for(const q of parts){const k=q.life/q.max;ctx.globalAlpha=(1-k)*0.85;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1-k*0.5),0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  drawPlayer();
  ctx.font='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.fillStyle=C.mu;
  ctx.fillText('←/→ move · Space or tap to jump · jump again on a wall',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
function wake(){
  userT=3.5;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(['ArrowLeft','ArrowRight','a','d'].includes(k)){keys[k]=true;wake();}
  if([' ','ArrowUp','w','z'].includes(k)&&!e.repeat){input.jumpPressed=true;wake();}
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;});
function pp(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/S;}
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=true;input.jumpPressed=true;wake();e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(ptr.down)pp(e);});
addEventListener('pointerup',()=>{ptr.down=false;});addEventListener('pointercancel',()=>{ptr.down=false;});
requestAnimationFrame(frame);
})();
</script></body></html>
