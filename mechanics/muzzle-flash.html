<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muzzle Flash &amp; Recoil</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K={
  FIRE_INTERVAL: 0.09,   // s between shots while the trigger is held
  BURST_COUNT: 5,        // shots per automatic burst
  BURST_PAUSE: 0.8,      // s between automatic bursts
  FLASH_TIME: 0.04,      // s the muzzle flash sprite stays up (~2 frames)
  FLASH_SIZE: 16,        // px length of the muzzle flash
  TRACER_SPEED: 2600,    // px/s travel speed of the bullet tracer
  TRACER_LEN: 44,        // px length of the tracer streak
  SPREAD: 0.035,         // rad random aim deviation per shot (±)
  RECOIL_KICK: 6,        // px the gun slides back per shot
  RECOIL_ANGLE: 0.07,    // rad the muzzle climbs per shot
  RECOIL_RETURN: 16,     // 1/s how fast the gun settles back (exponential)
  SHELL_SPEED_X: 70,     // px/s backward ejection speed of a casing
  SHELL_SPEED_Y: 170,    // px/s upward ejection speed of a casing
  SHELL_SPIN: 22,        // rad/s max casing spin
  SHELL_GRAVITY: 900,    // px/s² pull on casings
  SHELL_BOUNCE: 0.45,    // 0–1 vertical speed kept on each floor bounce
  SHELL_FRICTION: 0.6,   // 0–1 horizontal speed kept on each floor bounce
  SHELL_LIFE: 2.5,       // s before a casing fades out
  MAX_SHELLS: 40,        // casing cap (oldest removed first)
  AIM_SPEED: 12,         // 1/s how fast the gun turns toward its aim point
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280,GY=236;
const BARREL=36;  // px barrel length from pivot
const gun={x:0,y:0,ang:0,aim:0,recoil:0,climb:0,cool:0,flash:0,flashRot:0,flashKind:0};
const targets=[{dx:80,h:62},{dx:128,h:110},{dx:170,h:44}].map(t=>({...t,x:0,y:0,r:12,flash:0,wob:0,wv:0,phase:Math.random()*6}));
function layout(){GY=VH-44;gun.x=VW/2-150;gun.y=GY-36;for(const t of targets){t.x=VW/2+t.dx;}}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---- mechanic ----
let tracers=[],shells=[],sparks=[];
function muzzle(){const a=gun.ang-gun.climb,l=BARREL-gun.recoil;return{x:gun.x+Math.cos(a)*l,y:gun.y+Math.sin(a)*l,a};}
function rayHit(ox,oy,a){ // nearest target circle along the ray, or null
  const dx=Math.cos(a),dy=Math.sin(a);let best=null;
  for(const t of targets){const fx=t.x-ox,fy=t.y-oy,p=fx*dx+fy*dy,q=fx*fx+fy*fy-p*p;
    if(p>0&&q<t.r*t.r){const d=p-Math.sqrt(t.r*t.r-q);if(!best||d<best.d)best={d,t};}}
  return best;
}
function fire(){
  const m=muzzle(),a=gun.ang+(Math.random()*2-1)*K.SPREAD,hit=rayHit(m.x,m.y,a);
  tracers.push({x:m.x,y:m.y,a,d:0,max:hit?hit.d:700,t:hit&&hit.t});              // hitscan, drawn as a fast streak
  gun.flash=K.FLASH_TIME;gun.flashRot=(Math.random()-0.5)*0.5;gun.flashKind=(gun.flashKind+1)%2;  // vary the sprite each shot
  gun.recoil+=K.RECOIL_KICK;gun.climb+=K.RECOIL_ANGLE;                            // kicks stack during a burst
  // eject a casing from the port (on top of the gun, a third of the way along), backward and up
  const pa=gun.ang-gun.climb,px=gun.x+Math.cos(pa)*12+Math.sin(pa)*5,py=gun.y+Math.sin(pa)*12-Math.cos(pa)*5;
  if(shells.length>=K.MAX_SHELLS)shells.shift();
  shells.push({x:px,y:py,vx:-Math.cos(pa)*K.SHELL_SPEED_X*(0.7+Math.random()*0.6),vy:-K.SHELL_SPEED_Y*(0.8+Math.random()*0.4),
    rot:Math.random()*6,spin:(Math.random()*2-1)*K.SHELL_SPIN,life:0});
  sfx();
}
function gunUpdate(dt,trigger,aimX,aimY){
  gun.aim=Math.atan2(aimY-gun.y,aimX-gun.x);
  gun.ang+=(gun.aim-gun.ang)*Math.min(1,dt*K.AIM_SPEED);
  const back=Math.exp(-K.RECOIL_RETURN*dt);gun.recoil*=back;gun.climb*=back;   // settle back to rest
  gun.cool-=dt;gun.flash=Math.max(0,gun.flash-dt);
  if(trigger&&gun.cool<=0){fire();gun.cool=K.FIRE_INTERVAL;}
  for(const tr of tracers){tr.d+=K.TRACER_SPEED*dt;
    if(tr.d>=tr.max&&!tr.done){tr.done=true;if(tr.t)impact(tr.x+Math.cos(tr.a)*tr.max,tr.y+Math.sin(tr.a)*tr.max,tr.t,tr.a);}}
  tracers=tracers.filter(tr=>tr.d-K.TRACER_LEN<tr.max);
  for(const s of shells){s.life+=dt;s.vy+=K.SHELL_GRAVITY*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.spin*dt;
    if(s.y>GY-1&&s.vy>0){s.y=GY-1;s.vy*=-K.SHELL_BOUNCE;s.vx*=K.SHELL_FRICTION;s.spin*=0.5;if(Math.abs(s.vy)<25){s.vy=0;s.spin=0;}}}
  shells=shells.filter(s=>s.life<K.SHELL_LIFE);
}
function drawGun(){
  const m=muzzle();
  ctx.save();ctx.translate(gun.x,gun.y);ctx.rotate(gun.ang-gun.climb);ctx.translate(-gun.recoil,0);
  rr(-12,-7,26,14,4);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();
  rr(12,-3.5,BARREL-12,7,2);ctx.fillStyle=C.ink;ctx.fill();
  ctx.fillStyle=C.mu;ctx.fillRect(8,-7,8,2);                     // ejection port
  ctx.restore();
  if(gun.flash>0){ // flash sprite at the muzzle, rotated with the gun plus a little random roll
    const L=K.FLASH_SIZE,w=gun.flashKind?0.55:0.4;
    ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a+gun.flashRot);
    ctx.fillStyle=C.y;ctx.beginPath();ctx.moveTo(0,-L*w);ctx.lineTo(L*0.35,-L*0.12);ctx.lineTo(L,0);ctx.lineTo(L*0.35,L*0.12);ctx.lineTo(0,L*w);ctx.lineTo(-L*0.15,0);ctx.closePath();ctx.fill();
    if(gun.flashKind){ctx.beginPath();ctx.moveTo(L*0.2,-L*0.1);ctx.lineTo(L*0.6,-L*0.55);ctx.lineTo(L*0.35,0);ctx.lineTo(L*0.6,L*0.55);ctx.lineTo(L*0.2,L*0.1);ctx.fill();}
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(L*0.1,0,L*0.2,0,6.283);ctx.fill();
    ctx.restore();
  }
}
function drawShotFx(){
  ctx.lineCap='round';
  for(const tr of tracers){const d1=Math.min(tr.d,tr.max),d0=Math.max(0,tr.d-K.TRACER_LEN);if(d1<=d0)continue;
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.6;ctx.beginPath();
    ctx.moveTo(tr.x+Math.cos(tr.a)*d0,tr.y+Math.sin(tr.a)*d0);ctx.lineTo(tr.x+Math.cos(tr.a)*d1,tr.y+Math.sin(tr.a)*d1);ctx.stroke();}
  for(const s of shells){ctx.globalAlpha=Math.min(1,(K.SHELL_LIFE-s.life)/0.4);ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
    ctx.fillStyle=C.y;ctx.fillRect(-2.5,-1,5,2);ctx.restore();}
  ctx.globalAlpha=1;ctx.lineCap='butt';
}

// ---- demo ----
let time=0,userT=0,AC=null;
const ptr={down:false,x:0,y:0},keys={};
const ai={target:0,shots:0,wait:0.3};
function impact(x,y,t,a){
  t.flash=1;t.wv+=Math.cos(a)*6;
  for(let i=0;i<6&&sparks.length<50;i++){const b=a+Math.PI+(Math.random()-0.5)*1.8,s=80+Math.random()*160;
    sparks.push({x,y,vx:Math.cos(b)*s,vy:Math.sin(b)*s,life:0,max:0.15+Math.random()*0.2});}
}
function sfx(){
  if(!AC||userT<=0)return;
  const t=AC.currentTime,n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*0.06,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;g.gain.value=0.08;
  n.buffer=b;n.connect(f).connect(g).connect(AC.destination);n.start(t);
}
function update(dt){
  time+=dt;
  for(const t of targets){t.y=GY-t.h+Math.sin(time*1.3+t.phase)*8;t.flash=Math.max(0,t.flash-dt*8);t.wv+=(-120*t.wob-8*t.wv)*dt;t.wob+=t.wv*dt;}
  let trig=false,ax,ay;
  if(userT>0){userT-=dt;ax=ptr.x;ay=ptr.y;trig=ptr.down||keys[' '];if(trig)userT=Math.max(userT,3.5);}
  else{const t=targets[ai.target];ax=t.x;ay=t.y;
    if(ai.wait>0)ai.wait-=dt;
    else if(Math.abs(gun.aim-gun.ang)<0.04){trig=true;
      if(gun.cool<=0&&++ai.shots>=K.BURST_COUNT){ai.shots=0;ai.wait=K.BURST_PAUSE;ai.target=(ai.target+1+Math.floor(Math.random()*2))%targets.length;}}}
  gunUpdate(dt,trig,ax,ay);
  for(const s of sparks){s.life+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;}
  sparks=sparks.filter(s=>s.life<s.max);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  ctx.fillStyle='#131317';ctx.fillRect(0,GY,VW,VH-GY);
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(VW,GY);ctx.stroke();
  // targets on poles
  for(const t of targets){ctx.strokeStyle=C.mu;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(t.x,GY);ctx.lineTo(t.x,t.y);ctx.stroke();
    ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.wob*0.04);
    ctx.beginPath();ctx.arc(0,0,t.r,0,6.283);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,t.r*0.5,0,6.283);ctx.stroke();ctx.fillStyle=C.a;ctx.beginPath();ctx.arc(0,0,2.5,0,6.283);ctx.fill();
    if(t.flash>0){ctx.globalAlpha=t.flash;ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,0,t.r+1,0,6.283);ctx.fill();ctx.globalAlpha=1;}
    ctx.restore();}
  // turret pedestal
  ctx.fillStyle='#17171C';rr(gun.x-10,gun.y,20,GY-gun.y,3);ctx.fill();ctx.strokeStyle=C.mu;ctx.lineWidth=1.5;ctx.stroke();
  drawShotFx();drawGun();
  ctx.lineWidth=1.5;ctx.lineCap='round';
  for(const s of sparks){ctx.globalAlpha=1-s.life/s.max;ctx.strokeStyle=C.y;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*0.03,s.y-s.vy*0.03);ctx.stroke();}
  ctx.globalAlpha=1;ctx.lineCap='butt';
  ctx.font='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.fillStyle=C.mu;
  ctx.fillText('Point to aim · hold mouse or Space to fire',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
function wake(){
  userT=3.5;ai.wait=0.5;ai.shots=0;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function pp(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/S;ptr.y=(e.clientY-r.top)/S;}
ptr.x=VW/2+120;ptr.y=GY-70;
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=true;wake();e.preventDefault();});
cv.addEventListener('pointermove',e=>{pp(e);if(userT>0)userT=Math.max(userT,2);});
addEventListener('pointerup',()=>{ptr.down=false;});addEventListener('pointercancel',()=>{ptr.down=false;});
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();if(e.key===' '){keys[' ']=true;wake();}});
addEventListener('keyup',e=>{if(e.key===' ')keys[' ']=false;});
addEventListener('blur',()=>{keys[' ']=false;ptr.down=false;});
requestAnimationFrame(frame);
})();
</script></body></html>
