<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural SFX</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K = {
  MASTER_VOL: 0.22,      // 0-1 overall output gain
  ATTACK: 0.004,         // s linear attack at the start of every layer
  DECAY_POW: 2,          // decay curve exponent after the attack (1 = linear, higher = punchier)
  CURVE_SAMPLES: 64,     // points per pitch / gain curve handed to WebAudio
  JUMP_F0: 220,          // Hz jump start pitch
  JUMP_F1: 660,          // Hz jump end pitch (sweeps up)
  JUMP_DUR: 0.22,        // s jump length
  JUMP_VOL: 0.5,         // 0-1 jump layer gain
  COIN_F0: 988,          // Hz coin first tone (B5)
  COIN_F1: 1319,         // Hz coin second tone (E6)
  COIN_STEP: 0.07,       // s when the coin jumps to its second tone
  COIN_DUR: 0.32,        // s coin length
  COIN_VOL: 0.35,        // 0-1 coin layer gain
  COIN_DECAY_POW: 1,     // coin decay exponent (linear so the second tone rings)
  HIT_NOISE_CUT0: 2400,  // Hz hit noise lowpass cutoff at start
  HIT_NOISE_CUT1: 1200,  // Hz hit noise lowpass cutoff at end
  HIT_NOISE_DUR: 0.09,   // s hit noise burst length
  HIT_NOISE_VOL: 0.7,    // 0-1 hit noise gain
  HIT_THUMP_F0: 160,     // Hz hit thump start pitch
  HIT_THUMP_F1: 45,      // Hz hit thump end pitch
  HIT_THUMP_DUR: 0.18,   // s hit thump length
  HIT_THUMP_VOL: 1,      // 0-1 hit thump gain
  EXPLO_CUT0: 2000,      // Hz explosion lowpass cutoff at start
  EXPLO_CUT1: 70,        // Hz explosion lowpass cutoff at end
  EXPLO_DUR: 1.1,        // s explosion length
  EXPLO_VOL: 1,          // 0-1 explosion gain
  LASER_F0: 1600,        // Hz laser start pitch
  LASER_F1: 160,         // Hz laser end pitch (fast sweep down)
  LASER_DUR: 0.17,       // s laser length
  LASER_VOL: 0.35,       // 0-1 laser gain
  ATTRACT_INTERVAL: 1.5, // s between silent attract-mode plays
  ATTRACT_IDLE: 3.5,     // s after user input before attract mode resumes
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const FONT='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ---- mechanic ----
// Each sound is a list of layers. A layer is an oscillator (src = wave type) or filtered white noise
// (src 'noise', f0/f1 = filter cutoff). The SAME freqAt/ampAt functions drive both the audio and the drawing.
const SOUNDS=[
  {name:'JUMP',layers:[{src:'square',f0:K.JUMP_F0,f1:K.JUMP_F1,dur:K.JUMP_DUR,vol:K.JUMP_VOL}]},
  {name:'COIN',layers:[{src:'square',f0:K.COIN_F0,f1:K.COIN_F1,step:K.COIN_STEP,dur:K.COIN_DUR,vol:K.COIN_VOL,pow:K.COIN_DECAY_POW}]},
  {name:'HIT',layers:[{src:'noise',filter:'lowpass',f0:K.HIT_NOISE_CUT0,f1:K.HIT_NOISE_CUT1,dur:K.HIT_NOISE_DUR,vol:K.HIT_NOISE_VOL},
                      {src:'sine',f0:K.HIT_THUMP_F0,f1:K.HIT_THUMP_F1,dur:K.HIT_THUMP_DUR,vol:K.HIT_THUMP_VOL}]},
  {name:'EXPLOSION',layers:[{src:'noise',filter:'lowpass',f0:K.EXPLO_CUT0,f1:K.EXPLO_CUT1,dur:K.EXPLO_DUR,vol:K.EXPLO_VOL}]},
  {name:'LASER',layers:[{src:'sawtooth',f0:K.LASER_F0,f1:K.LASER_F1,dur:K.LASER_DUR,vol:K.LASER_VOL}]},
];
function freqAt(L,t){                       // Hz at time t (s)
  if(L.step!=null)return t<L.step?L.f0:L.f1;  // two-tone: hard switch
  return L.f0*Math.pow(L.f1/L.f0,clamp(t/L.dur,0,1));  // exponential sweep = even in pitch
}
function ampAt(L,t){                        // gain at time t: linear attack, then power-curve decay to 0
  if(t<0||t>=L.dur)return 0;
  if(t<K.ATTACK)return L.vol*t/K.ATTACK;
  return L.vol*Math.pow(1-(t-K.ATTACK)/(L.dur-K.ATTACK),L.pow||K.DECAY_POW);
}
function curve(fn,L){const n=K.CURVE_SAMPLES,a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=fn(L,i/(n-1)*L.dur);return a;}
let ac=null,master=null,noiseBuf=null;
function unlockAudio(){                     // call from a user gesture only
  try{
    if(!ac){
      ac=new(window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=K.MASTER_VOL;master.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null;}
}
function playSound(snd){
  if(!ac)return;
  const t0=ac.currentTime+0.005;
  for(const L of snd.layers){
    const g=ac.createGain();g.gain.value=0;g.gain.setValueCurveAtTime(curve(ampAt,L),t0,L.dur);g.connect(master);
    let src;
    if(L.src==='noise'){
      src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;
      const f=ac.createBiquadFilter();f.type=L.filter;f.frequency.setValueCurveAtTime(curve(freqAt,L),t0,L.dur);
      src.connect(f).connect(g);src.start(t0,Math.random()*0.5);   // random offset: every hit sounds a bit different
    }else{
      src=ac.createOscillator();src.type=L.src;src.frequency.setValueCurveAtTime(curve(freqAt,L),t0,L.dur);
      src.connect(g);src.start(t0);
    }
    src.stop(t0+L.dur+0.02);
  }
}

// ---- demo ----
const pads=SOUNDS.map(()=>({x:0,y:0,w:72,h:34,flash:0}));
let vis=null,autoT=0.3,autoN=0,userT=0,seed=1;
let P={x:0,y:0,w:400,h:150};
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;
  P.x=VW/2-200;P.y=VH/2-104;pads.forEach((p,i)=>{p.x=P.x+i*82;p.y=P.y+P.h+14;});
}
addEventListener('resize',resize);resize();
function trigger(i,audible){vis={snd:SOUNDS[i],i,t:0};seed=(seed*16807)%2147483647;pads[i].flash=1;if(audible)playSound(SOUNDS[i]);}
const hash=n=>{const s=Math.sin(n*127.1+seed)*43758.5453;return (s-Math.floor(s))*2-1;};
function drawVisualiser(){
  const {x,y,w,h}=P;rr(x,y,w,h,8);ctx.fillStyle='#121216';ctx.fill();ctx.strokeStyle='#26262E';ctx.lineWidth=1;ctx.stroke();
  if(!vis)return;
  const L=vis.snd.layers,T=Math.max(0.2,...L.map(l=>l.dur)),N=220,yc=y+h/2+8,A=h*0.34,gx=x+12,gw=w-24;
  const tx=t=>gx+t/T*gw,fy=f=>y+h-10-Math.log(f/40)/Math.log(5000/40)*(h-34);
  const amp=t=>Math.min(1,L.reduce((s,l)=>s+ampAt(l,t),0));
  // amplitude envelope (mirrored)
  ctx.beginPath();for(let i=0;i<=N;i++){const t=i/N*T;ctx.lineTo(tx(t),yc-amp(t)*A);}
  for(let i=N;i>=0;i--){const t=i/N*T;ctx.lineTo(tx(t),yc+amp(t)*A);}
  ctx.closePath();ctx.fillStyle='#1D1D24';ctx.fill();ctx.strokeStyle=C.mu;ctx.lineWidth=1;ctx.stroke();
  // stylised waveform up to the playhead (phase speed proportional to pitch so sweeps read as squeeze/stretch)
  const fmax=Math.max(...L.map(l=>Math.max(l.f0,l.f1))),ph=L.map(()=>0),upto=Math.min(N,Math.floor(vis.t/T*N));
  ctx.beginPath();
  for(let i=0;i<=upto;i++){
    const t=i/N*T;let v=0;
    L.forEach((l,j)=>{const a=ampAt(l,t);ph[j]+=freqAt(l,t)/fmax*1.1;
      const s=l.src==='noise'?hash(i+j*999):l.src==='square'?Math.sign(Math.sin(ph[j])):l.src==='sawtooth'?((ph[j]/6.283)%1)*2-1:Math.sin(ph[j]);
      v+=a*s;});
    ctx.lineTo(tx(t),yc-clamp(v,-1,1)*A);
  }
  ctx.strokeStyle=C.ink;ctx.lineWidth=1;ctx.stroke();
  // pitch (or filter cutoff, dashed) on a log scale: bright up to the playhead
  for(const l of L){
    if(l.src==='noise')ctx.setLineDash([4,3]);
    for(const pass of [0,1]){
      ctx.globalAlpha=pass?1:0.3;ctx.strokeStyle=C.a;ctx.lineWidth=2;ctx.beginPath();
      const end=pass?Math.min(vis.t,l.dur):l.dur;
      for(let i=0;i<=60;i++){const t=i/60*end;ctx.lineTo(tx(t),fy(freqAt(l,t)));}
      ctx.stroke();
    }
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  if(vis.t<T){ctx.strokeStyle=C.y;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(tx(vis.t),y+22);ctx.lineTo(tx(vis.t),y+h-6);ctx.stroke();}
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 11px '+FONT;ctx.fillStyle=C.ink;ctx.fillText(vis.snd.name,x+12,y+14);
  const nw=ctx.measureText(vis.snd.name).width;ctx.font='9px '+FONT;ctx.fillStyle=C.mu;
  ctx.fillText(T.toFixed(2)+' s · '+L.map(l=>(l.src==='noise'?'noise lp ':l.src+' ')+l.f0+'→'+l.f1+' Hz').join(' + '),x+20+nw,y+14);
  ctx.textAlign='right';ctx.fillStyle=C.a;ctx.fillText('pitch',x+w-44,y+14);ctx.fillStyle=C.mu;ctx.fillText('amp',x+w-12,y+14);
  ctx.fillText('1k',x+w-4,fy(1000));ctx.fillText('100',x+w-4,fy(100));
}
function drawPads(){
  pads.forEach((p,i)=>{
    const on=vis&&vis.i===i,lift=p.flash*3;rr(p.x,p.y-lift,p.w,p.h,7);ctx.fillStyle='#16161B';ctx.fill();
    ctx.lineWidth=1.5;ctx.strokeStyle=p.flash>0.05?C.a:on?C.ink:'#2E2E36';ctx.stroke();
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='9px '+FONT;ctx.fillStyle=C.mu;ctx.fillText(String(i+1),p.x+8,p.y+p.h/2-lift);
    ctx.textAlign='center';ctx.font='700 10px '+FONT;ctx.fillStyle=on?C.ink:C.mu;ctx.fillText(SOUNDS[i].name,p.x+p.w/2+4,p.y+p.h/2-lift);
  });
}
function update(dt){
  if(userT>0)userT-=dt;
  else{autoT-=dt;if(autoT<=0){trigger(autoN%SOUNDS.length,false);autoN++;autoT=K.ATTRACT_INTERVAL;}}  // attract is always silent
  if(vis)vis.t+=dt;
  for(const p of pads)p.flash=Math.max(0,p.flash-dt*4);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  drawVisualiser();drawPads();
  ctx.font='10px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=C.mu;
  ctx.fillText('Click a pad or press 1–5'+(ac?'':' · sound starts on your first click'),VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  update(dt);draw();
}
function user(i){unlockAudio();userT=K.ATTRACT_IDLE;autoT=0.6;trigger(i,true);}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S;
  const i=pads.findIndex(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y-4&&y<=p.y+p.h);
  user(i>=0?i:(vis?vis.i:0));e.preventDefault();      // clicking anywhere else replays the current sound
});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  const n=+e.key;if(n>=1&&n<=SOUNDS.length)user(n-1);
  else if(e.key===' '||e.key==='Enter')user(vis?vis.i:0);
});
requestAnimationFrame(frame);
})();
</script></body></html>
