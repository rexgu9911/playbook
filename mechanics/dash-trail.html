<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dash Trail</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/400,H/250);VW=W/S;VH=H/S;
}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DASH_T=0.15,COOL=0.55,MAXD=170,R=11;
const p={x:VW/2,y:VH/2,sx:0,sy:0,ex:0,ey:0,t:-1,ang:0,cool:0,sq:0,buf:0,bx:0,by:0};
const cur={x:VW*0.7,y:VH*0.4,tx:VW*0.7,ty:VH*0.4,vis:1};
let ghosts=[],lines=[],dust=[],pops=[],ghostT=0,userT=0,autoT=0.7,time=0;

function dash(tx,ty){
  if(!isFinite(tx+ty))return;
  if(p.t>=0||p.cool>0){p.buf=0.4;p.bx=tx;p.by=ty;return;}     // buffer the input
  let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<6)return;
  const len=Math.min(d,MAXD);dx/=d;dy/=d;
  p.sx=p.x;p.sy=p.y;p.ex=clamp(p.x+dx*len,R,VW-R);p.ey=clamp(p.y+dy*len,R,VH-R);p.t=0;p.ang=Math.atan2(dy,dx);p.buf=0;ghostT=0;
  for(let i=0;i<9;i++){const u=rnd(0,1),o=rnd(-18,18);                 // speed lines along the path
    lines.push({x:p.sx+dx*len*u-dy*o,y:p.sy+dy*len*u+dx*o,dx,dy,len:rnd(18,46),life:-u*DASH_T,max:rnd(0.18,0.3)});}
  for(let i=0;i<5;i++)dust.push({x:p.x,y:p.y,vx:-dx*rnd(30,90)+rnd(-30,30),vy:-dy*rnd(30,90)+rnd(-30,30),life:0,max:rnd(0.25,0.45),r:rnd(2,4)});
}
function update(dt){
  time+=dt;
  if(userT>0){userT-=dt;cur.x=cur.tx;cur.y=cur.ty;}
  else{                                                       // auto: a ghost cursor picks targets
    const e=Math.min(1,dt*7);cur.x+=(cur.tx-cur.x)*e;cur.y+=(cur.ty-cur.y)*e;
    autoT-=dt;
    if(autoT<=0){
      if(autoT>-9&&Math.hypot(cur.tx-p.x,cur.ty-p.y)>30&&p.t<0){dash(cur.tx,cur.ty);autoT=-10;}
      else if(p.t<0&&p.cool<=0.1){for(let i=0;i<8;i++){cur.tx=rnd(34,VW-34);cur.ty=rnd(30,VH-30);if(Math.hypot(cur.tx-p.x,cur.ty-p.y)>100)break;}autoT=rnd(0.45,0.8);}
    }
  }
  if(p.buf>0){p.buf-=dt;if(p.t<0&&p.cool<=0)dash(p.bx,p.by);}
  if(p.t>=0){
    p.t+=dt;const k=Math.min(1,p.t/DASH_T),e=1-Math.pow(1-k,2.2);          // fast out, soft landing
    p.x=p.sx+(p.ex-p.sx)*e;p.y=p.sy+(p.ey-p.sy)*e;
    ghostT-=dt;if(ghostT<=0&&ghosts.length<16){ghostT=0.016;ghosts.push({x:p.x,y:p.y,ang:p.ang,st:1-k,life:0,max:0.34});}
    if(k>=1){p.t=-1;p.cool=COOL;p.sq=0.35;
      for(let i=0;i<6;i++){const a=p.ang+rnd(-0.9,0.9);dust.push({x:p.x,y:p.y,vx:Math.cos(a)*rnd(40,130),vy:Math.sin(a)*rnd(40,130),life:0,max:rnd(0.25,0.5),r:rnd(2,4)});}}
  }else if(p.cool>0){p.cool-=dt;if(p.cool<=0){p.cool=0;pops.push({t:0});}}
  p.sq+=(0-p.sq)*Math.min(1,dt*10);
  for(const g of ghosts)g.life+=dt;ghosts=ghosts.filter(g=>g.life<g.max);
  for(const l of lines){l.life+=dt;if(l.life>0){l.x-=l.dx*60*dt;l.y-=l.dy*60*dt;}}lines=lines.filter(l=>l.life<l.max);
  for(const q of dust){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;const dr=1-Math.min(1,dt*5);q.vx*=dr;q.vy*=dr;}
  dust=dust.filter(q=>q.life<q.max);if(dust.length>40)dust.splice(0,dust.length-40);
  for(const o of pops)o.t+=dt;pops=pops.filter(o=>o.t<0.3);
  if(!isFinite(p.x+p.y)){p.x=VW/2;p.y=VH/2;p.t=-1;}
  p.x=clamp(p.x,R,Math.max(R,VW-R));p.y=clamp(p.y,R,Math.max(R,VH-R));
}
function body(st,ang,sq){ // rounded square, stretched along dash direction
  ctx.rotate(ang);ctx.scale(1+st*0.9-sq*0.3,1-st*0.45+sq*0.3);rr(-R,-R,R*2,R*2,7);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  // cursor reticle
  ctx.strokeStyle=C.mu;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cur.x,cur.y,7,0,6.283);ctx.stroke();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cur.x,cur.y,1.6,0,6.283);ctx.fill();
  // speed lines
  ctx.lineCap='round';
  for(const l of lines){if(l.life<0)continue;const k=l.life/l.max,len=l.len*(1-k*0.5);ctx.globalAlpha=(1-k)*0.7;ctx.strokeStyle=C.ink;ctx.lineWidth=1.3;
    ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x-l.dx*len,l.y-l.dy*len);ctx.stroke();}
  ctx.lineCap='butt';ctx.globalAlpha=1;
  // dash ribbon
  if(ghosts.length>1){const g0=ghosts[0],g1=ghosts[ghosts.length-1],al=1-g1.life/g1.max;
    const gr=ctx.createLinearGradient(g0.x,g0.y,g1.x,g1.y);gr.addColorStop(0,'rgba(255,77,46,0)');gr.addColorStop(1,'rgba(255,77,46,'+(0.5*al).toFixed(3)+')');
    ctx.strokeStyle=gr;ctx.lineWidth=R*1.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(g0.x,g0.y);ctx.lineTo(g1.x,g1.y);ctx.stroke();ctx.lineCap='butt';}
  // afterimages
  for(let i=0;i<ghosts.length;i+=2){const g=ghosts[i],k=g.life/g.max;ctx.save();ctx.translate(g.x,g.y);body(g.st*0.6,g.ang,0);
    ctx.globalAlpha=(1-k)*0.45;ctx.fillStyle=k<0.35?C.y:C.a;ctx.fill();ctx.globalAlpha=(1-k)*0.9;ctx.strokeStyle=k<0.35?C.y:C.a;ctx.lineWidth=1.2;ctx.stroke();ctx.restore();}
  ctx.globalAlpha=1;
  for(const q of dust){const k=q.life/q.max;ctx.globalAlpha=(1-k)*0.7;ctx.fillStyle=C.mu;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1-k*0.5),0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  // cooldown ring
  if(p.cool>0){const k=1-p.cool/COOL;ctx.lineWidth=2.5;ctx.strokeStyle='#2A2A32';ctx.beginPath();ctx.arc(p.x,p.y,R+9,0,6.283);ctx.stroke();
    ctx.strokeStyle=C.y;ctx.lineCap='round';ctx.beginPath();ctx.arc(p.x,p.y,R+9,-Math.PI/2,-Math.PI/2+k*6.283);ctx.stroke();ctx.lineCap='butt';}
  for(const o of pops){const k=o.t/0.3,e=1-(1-k)*(1-k);ctx.globalAlpha=1-k;ctx.strokeStyle=C.y;ctx.lineWidth=2*(1-k)+0.5;ctx.beginPath();ctx.arc(p.x,p.y,R+9+e*12,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  // character
  const dashing=p.t>=0,k=dashing?Math.min(1,p.t/DASH_T):1,st=dashing?Math.sin(Math.min(1,k*1.15)*Math.PI)*0.9:0;
  const bob=dashing?0:Math.sin(time*3)*1.5,la=Math.atan2(cur.y-p.y,cur.x-p.x);
  ctx.save();ctx.translate(p.x,p.y+bob);
  ctx.save();body(st,p.ang,p.sq);ctx.fillStyle=dashing&&k<0.5?C.ink:C.a;ctx.fill();ctx.restore();
  const ea=dashing?p.ang:la,ox=Math.cos(ea)*3.5,oy=Math.sin(ea)*3.5;
  ctx.fillStyle=dashing&&k<0.5?C.a:C.ink;rr(ox-5,oy-3,3,5,1.5);ctx.fill();rr(ox+2,oy-3,3,5,1.5);ctx.fill();
  ctx.restore();
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
function pt(e){const r=cv.getBoundingClientRect();cur.tx=clamp((e.clientX-r.left)/S,0,VW);cur.ty=clamp((e.clientY-r.top)/S,0,VH);}
cv.addEventListener('pointermove',e=>{pt(e);userT=Math.max(userT,2.5);});
cv.addEventListener('pointerdown',e=>{pt(e);userT=4;autoT=0.5;dash(cur.tx,cur.ty);e.preventDefault();});
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k))e.preventDefault();
  if(e.repeat)return;
  const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};
  if(dirs[k]){cur.tx=clamp(p.x+dirs[k][0]*MAXD,16,VW-16);cur.ty=clamp(p.y+dirs[k][1]*MAXD,16,VH-16);userT=4;autoT=0.5;dash(cur.tx,cur.ty);}
  else if(k===' '){userT=4;autoT=0.5;dash(cur.tx,cur.ty);}
});
requestAnimationFrame(frame);
})();
</script></body></html>
