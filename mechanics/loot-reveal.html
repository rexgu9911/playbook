<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loot Reveal</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const RAR=[{col:'#C9C6BF',rgb:'201,198,191',n:10,pw:0.5},{col:'#4DA3FF',rgb:'77,163,255',n:16,pw:0.7},{col:'#B66DFF',rgb:'182,109,255',n:24,pw:0.9},{col:'#F5E663',rgb:'245,230,99',n:36,pw:1.2}];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=400,VH=250,CX=200,CY=150;
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/400,H/250);VW=W/S;VH=H/S;CX=VW/2;CY=VH/2+42;
}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let phase='drop',t=0,pr=0,time=0,userT=0,rar=0,bag=[],trauma=0,bump=0,nextBump=0.25;
let cy=-80,cvy=0,top={y:0,vy:0,x:0,vx:0,r:0,rv:0,al:1},bot={al:1,y:0},item={s:0,vs:0,y:0,al:1},beam=0,flash=0;
let cracks=[],conf=[],dust=[];
function newCapsule(){
  if(!bag.length){bag=[0,0,1,1,2,3,0,1,2];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}
  rar=bag.pop();phase='drop';t=0;pr=0;cy=-VH/2-60;cvy=0;nextBump=0.25;bump=0;
  top={y:0,vy:0,x:0,vx:0,r:0,rv:0,al:1};bot={al:1,y:0};item={s:0,vs:0,y:0,al:1};beam=0;
  cracks=[];for(let k=0;k<3;k++){let x=rnd(-18,18),y=k===1?4:-30+k*6;const pts=[[x,y]];
    for(let i=0;i<5;i++){x+=rnd(-9,9);y+=k===1?rnd(3,6):rnd(4,8);pts.push([clamp(x,-24,24),y]);}cracks.push(pts);}
}
function open(){
  const R=RAR[rar];phase='show';t=0;flash=1;trauma=Math.min(1,0.4+R.pw*0.5);
  top.vy=-300;top.vx=rnd(-60,60);top.rv=rnd(-7,7);item.vs=9;
  for(let i=0;i<R.n&&conf.length<70;i++){const a=rnd(-Math.PI*0.9,-Math.PI*0.1),sp=rnd(150,420)*(0.7+R.pw*0.4);
    conf.push({x:CX,y:CY-30,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:rnd(0,6),rv:rnd(-10,10),life:0,max:rnd(0.9,1.6),w:rnd(3,7),col:[R.col,C.ink,R.col,C.a][i%4]});}
}
function poke(){
  if(phase==='shake'){pr=Math.min(1,pr+0.34);bump=1;}
  else if(phase==='show'&&t>0.5){phase='out';t=0;}
}
function update(dt){
  time+=dt;t+=dt;if(userT>0)userT-=dt;
  trauma=Math.max(0,trauma-dt*1.6);flash=Math.max(0,flash-dt*5);bump=Math.max(0,bump-dt*6);
  if(phase==='drop'){cvy+=((0-cy)*170-cvy*13)*dt;cy+=cvy*dt;if(t>0.75){phase='shake';t=0;cy=0;}}
  else if(phase==='shake'){
    pr=Math.min(1,pr+dt/1.5);
    if(pr>=nextBump){nextBump+=0.25;bump=1;for(let i=0;i<4;i++)dust.push({x:CX+rnd(-24,24),y:CY,vx:rnd(-50,50),vy:rnd(-30,-5),life:0,max:rnd(0.3,0.5),r:rnd(2,4)});}
    if(pr>=1)open();
  }else if(phase==='show'){
    top.vy+=900*dt;top.y+=top.vy*dt;top.x+=top.vx*dt;top.r+=top.rv*dt;top.al=clamp(1-(t-0.4)/0.4,0,1);
    bot.y+=(6-bot.y)*Math.min(1,dt*8);bot.al=clamp(1-(t-0.9)/0.5,0.25,1);
    item.vs+=((1-item.s)*210-item.vs*13)*dt;item.s+=item.vs*dt;item.y+=(-46-item.y)*Math.min(1,dt*6);
    beam+=(1-beam)*Math.min(1,dt*9);
    if(t>(userT>0?4.5:2.3)){phase='out';t=0;}
  }else if(phase==='out'){item.s*=1-Math.min(1,dt*9);beam*=1-Math.min(1,dt*8);bot.al=Math.max(0,bot.al-dt*3);if(t>0.4)newCapsule();}
  if(!isFinite(cy+item.s+top.y)){newCapsule();}
  for(const q of conf){q.life+=dt;q.vy+=560*dt;const dr=1-Math.min(1,dt*1.6);q.vx*=dr;q.vy*=dr;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.rv*dt;}
  conf=conf.filter(q=>q.life<q.max);
  for(const q of dust){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}dust=dust.filter(q=>q.life<q.max);
}
function half(up){const s=up?-1:1;ctx.beginPath();ctx.moveTo(-27,0);ctx.lineTo(-27,s*12);ctx.arcTo(-27,s*32,0,s*32,20);ctx.arcTo(27,s*32,27,0,20);ctx.lineTo(27,0);ctx.closePath();}
function itemShape(k){
  ctx.beginPath();
  if(k===0)ctx.arc(0,0,13,0,6.283);
  else if(k===1){ctx.moveTo(0,-16);ctx.lineTo(13,-3);ctx.lineTo(0,16);ctx.lineTo(-13,-3);ctx.closePath();}
  else if(k===2){for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15);}ctx.closePath();}
  else{for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?7.5:17;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();}
}
function draw(){
  const R=RAR[rar],sh=trauma*trauma;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,D*S*Math.sin(time*63)*7*sh,D*S*Math.cos(time*51)*6*sh);
  ctx.fillStyle=C.dot;for(let x=-10;x<VW+20;x+=20)for(let y=-10;y<VH+20;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  const shown=phase==='show'||phase==='out';
  // rarity beam
  if(beam>0.01){const bw=(26+R.pw*22)*beam*(1+Math.sin(time*9)*0.05);
    const g=ctx.createLinearGradient(CX-bw,0,CX+bw,0);g.addColorStop(0,'rgba('+R.rgb+',0)');g.addColorStop(0.5,'rgba('+R.rgb+','+(0.5*beam).toFixed(3)+')');g.addColorStop(1,'rgba('+R.rgb+',0)');
    ctx.fillStyle=g;ctx.fillRect(CX-bw,-20,bw*2,CY+20);
    ctx.fillStyle='rgba('+R.rgb+','+(0.55*beam).toFixed(3)+')';ctx.fillRect(CX-1.5*beam,-20,3*beam,CY+20);
    ctx.globalAlpha=0.5*beam;ctx.strokeStyle=R.col;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(CX,CY,bw*1.15,6,0,0,6.283);ctx.stroke();ctx.globalAlpha=1;}
  // pedestal
  ctx.strokeStyle=C.mu;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(CX-48,CY);ctx.lineTo(CX+48,CY);ctx.stroke();
  for(const q of dust){const k=q.life/q.max;ctx.globalAlpha=(1-k)*0.7;ctx.fillStyle=C.mu;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  // capsule
  const amp=phase==='shake'?0.6+pr*3.2+bump*3:0,jx=Math.sin(time*46)*amp,jr=Math.sin(time*39+1)*0.012*amp,sq=bump*0.1;
  ctx.save();ctx.translate(CX+jx,CY+cy);ctx.rotate(jr);ctx.scale(1+sq,1-sq);ctx.translate(0,-32);
  ctx.save();ctx.translate(0,bot.y);ctx.globalAlpha=shown?bot.al:1;half(false);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  if(top.al>0){
    ctx.save();ctx.globalAlpha=top.al;ctx.translate(top.x,top.y-1);ctx.rotate(top.r);half(true);ctx.fillStyle=C.a;ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(-12,-20,4,8,0.5,0,6.283);ctx.fill();
    if(!shown){ // cracks leak rarity light
      ctx.lineJoin='round';ctx.lineCap='round';
      cracks.forEach((pts,k)=>{const u=clamp((pr-k*0.24)/0.3,0,1);if(u<=0)return;const n=1+Math.floor(u*(pts.length-1));
        ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n;i++)ctx.lineTo(pts[i][0],pts[i][1]);
        ctx.strokeStyle='rgba('+R.rgb+',.35)';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle=C.ink;ctx.lineWidth=1.4;ctx.stroke();});
      ctx.lineCap='butt';}
    ctx.restore();
  }
  if(!shown){ctx.fillStyle=C.ink;ctx.fillRect(-27,-2,54,4);ctx.fillStyle=C.y;ctx.beginPath();ctx.arc(0,0,5,0,6.283);ctx.fill();ctx.strokeStyle='#17171C';ctx.lineWidth=1.5;ctx.stroke();}
  ctx.restore();
  // item + rotating rays
  if(shown&&item.s>0.01){
    const iy=CY-32+item.y+Math.sin(time*2.6)*2.5,s=clamp(item.s,0,1.6);
    ctx.save();ctx.translate(CX,iy);
    ctx.save();ctx.rotate(time*0.7);ctx.fillStyle=R.col;const nr=6+rar*2;
    for(let i=0;i<nr;i++){const a=i/nr*6.283;ctx.globalAlpha=(0.1+R.pw*0.1)*Math.min(1,s);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-0.1)*(34+rar*8)*s,Math.sin(a-0.1)*(34+rar*8)*s);ctx.lineTo(Math.cos(a+0.1)*(34+rar*8)*s,Math.sin(a+0.1)*(34+rar*8)*s);ctx.closePath();ctx.fill();}
    ctx.restore();ctx.globalAlpha=1;
    ctx.scale(s,s);ctx.rotate(Math.sin(time*1.7)*0.12);
    itemShape(rar);ctx.fillStyle=R.col;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(-4,-5,2.6,0,6.283);ctx.fill();
    ctx.restore();
  }
  // confetti
  for(const q of conf){const k=q.life/q.max;ctx.globalAlpha=k>0.7?(1-k)/0.3:1;ctx.fillStyle=q.col;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);const hh=3*Math.cos(q.rot*2);ctx.fillRect(-q.w/2,-hh/2,q.w,hh);ctx.restore();}
  ctx.globalAlpha=1;
  if(flash>0){ctx.globalAlpha=flash*0.9;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(CX,CY-32,(1-flash)*90+24,0,6.283);ctx.fill();ctx.globalAlpha=1;}
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(ts-last)/1000:0.016;last=ts;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
cv.addEventListener('pointerdown',e=>{userT=4;poke();e.preventDefault();});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if((e.key===' '||e.key==='Enter')&&!e.repeat){userT=4;poke();}
});
newCapsule();requestAnimationFrame(frame);
})();
</script></body></html>
