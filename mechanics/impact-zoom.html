<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impact Zoom</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K={
  ZOOM_PER_HIT: 0.09,     // extra scale one full-power hit adds (0.09 = 9% closer)
  ZOOM_MAX: 0.2,          // cap on the total extra scale when hits stack
  ROLL_PER_HIT: 0.022,    // rad of camera roll one hit adds (random side)
  ROLL_MAX: 0.045,        // rad cap on stacked roll
  PUNCH_IN: 0.05,         // s to reach the peak (fast ease-out)
  HOLD: 0.04,             // s held at the peak
  RETURN: 0.38,           // s to ease back to rest (ease-in-out)
  FOCUS_PULL: 0.35,       // 0–1 how far the view centre slides toward the impact point
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=k=>1-Math.pow(1-k,3);
const easeInOut=k=>k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

// ---- mechanic ----
// The punch is an envelope: ease from the current zoom up to a peak, hold, ease back to 0.
// A new hit restarts the envelope FROM WHERE THE CAMERA IS NOW, so overlapping hits stack without popping.
const cam={
  zoom:0,roll:0,fx:0,fy:0,                // current extra scale, roll (rad), focus point (stage px)
  z0:0,z1:0,r0:0,r1:0,fx0:0,fy0:0,fx1:0,fy1:0,  // envelope start -> peak values
  t:99,                                   // s since the last hit
};
function punch(x,y,power){
  const atRest=cam.zoom<0.001;
  cam.z0=cam.zoom;cam.r0=cam.roll;
  cam.fx0=atRest?x:cam.fx;cam.fy0=atRest?y:cam.fy;    // at rest: no visible focus to slide from
  cam.z1=Math.min(K.ZOOM_MAX,cam.zoom+K.ZOOM_PER_HIT*power);          // stack, capped
  const side=Math.random()<0.5?-1:1;
  cam.r1=clamp(cam.roll+side*K.ROLL_PER_HIT*power,-K.ROLL_MAX,K.ROLL_MAX);
  cam.fx1=x;cam.fy1=y;cam.t=0;
}
function updateCam(dt){
  cam.t+=dt;const t=cam.t;
  if(t<K.PUNCH_IN){                       // punch in: zoom, roll and focus all ease to the peak together
    const e=easeOut(t/K.PUNCH_IN);
    cam.zoom=lerp(cam.z0,cam.z1,e);cam.roll=lerp(cam.r0,cam.r1,e);
    cam.fx=lerp(cam.fx0,cam.fx1,e);cam.fy=lerp(cam.fy0,cam.fy1,e);
  }else{                                  // hold, then ease back out (focus stays on the impact)
    const u=clamp((t-K.PUNCH_IN-K.HOLD)/K.RETURN,0,1),e=1-easeInOut(u);
    cam.zoom=cam.z1*e;cam.roll=cam.r1*e;cam.fx=cam.fx1;cam.fy=cam.fy1;
  }
}
// Apply on top of the normal stage transform. (cx,cy) = where the camera looks when at rest.
function applyCam(cx,cy){
  const s=1+cam.zoom;
  const w=Math.min(1,cam.zoom/K.ZOOM_PER_HIT)*K.FOCUS_PULL;  // focus pull fades with the zoom
  const lx=lerp(cx,cam.fx,w),ly=lerp(cy,cam.fy,w);
  ctx.translate(cx,cy);ctx.rotate(cam.roll);ctx.scale(s,s);ctx.translate(-lx,-ly);
}

// ---- demo ----
let GY=220,userT=0,autoT=0.4,combo=0;
const N=4,targets=[];for(let i=0;i<N;i++)targets.push({x:0,sq:0,sv:0,flash:0});
let slams=[],sparks=[],rings=[];
function layout(){GY=VH-62;targets.forEach((o,i)=>o.x=VW/2+(i-(N-1)/2)*80);}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
}
addEventListener('resize',resize);resize();
function slam(i,pow){if(slams.length<5)slams.push({i,t:0,pow,hit:false});}
function impact(s){
  const o=targets[s.i],y=GY-22;
  punch(o.x,y,s.pow);                                  // <- the mechanic
  o.flash=1;o.sv-=8*s.pow;rings.push({x:o.x,t:0,pow:s.pow});
  for(let k=0;k<10&&sparks.length<60;k++){const a=-Math.PI*(0.1+Math.random()*0.8),sp=(120+Math.random()*200)*s.pow;
    sparks.push({x:o.x,y:y-18,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:0.3+Math.random()*0.3,col:k%2?C.y:C.ink});}
}
function update(dt){
  if(userT>0)userT-=dt;
  else{autoT-=dt;if(autoT<=0){
    slam(Math.floor(Math.random()*N),combo>0?0.8:1);
    if(combo>0){combo--;autoT=0.12;}else{combo=Math.random()<0.4?2:0;autoT=combo?0.12:1.0+Math.random()*0.5;}
  }}
  updateCam(dt);
  for(const s of slams){s.t+=dt;if(!s.hit&&s.t>=0.15){s.hit=true;impact(s);}}
  slams=slams.filter(s=>s.t<0.5);
  for(const o of targets){o.sv+=(-260*o.sq-13*o.sv)*dt;o.sq=clamp(o.sq+o.sv*dt,-0.5,0.45);o.flash=Math.max(0,o.flash-dt*7);
    if(!isFinite(o.sq))o.sq=o.sv=0;}
  for(const q of sparks){q.life+=dt;q.vy+=800*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.y>GY&&q.vy>0){q.y=GY;q.vy*=-0.3;q.vx*=0.6;}}
  sparks=sparks.filter(q=>q.life<q.max);
  for(const r of rings)r.t+=dt;rings=rings.filter(r=>r.t<0.4);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.save();applyCam(VW/2,VH/2);                      // world is drawn through the camera
  ctx.fillStyle=C.dot;for(let x=-60;x<VW+60;x+=20)for(let y=-60;y<VH+60;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  ctx.fillStyle='#131317';ctx.fillRect(-80,GY,VW+160,VH);
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-80,GY);ctx.lineTo(VW+80,GY);ctx.stroke();
  for(const r of rings){const k=r.t/0.4,e=easeOut(k);ctx.globalAlpha=1-k;ctx.strokeStyle=C.y;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(r.x,GY,(18+e*60)*r.pow,(3+e*9)*r.pow,0,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const o of targets){
    ctx.save();ctx.translate(o.x,GY);ctx.scale(1-o.sq*0.6,1+o.sq);
    rr(-14,-44,28,44,8);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=C.mu;ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(14,-18);ctx.moveTo(-6,-33);ctx.lineTo(-2,-29);ctx.moveTo(-2,-33);ctx.lineTo(-6,-29);
    ctx.moveTo(3,-33);ctx.lineTo(7,-29);ctx.moveTo(7,-33);ctx.lineTo(3,-29);ctx.stroke();
    if(o.flash>0){ctx.globalAlpha=o.flash;rr(-14,-44,28,44,8);ctx.fillStyle=C.ink;ctx.fill();ctx.globalAlpha=1;}
    ctx.restore();
  }
  for(const s of slams){const o=targets[s.i],top=GY-44*(1+targets[s.i].sq)-10;let y,al=1;
    if(s.t<0.15){const k=s.t/0.15;y=-60+(top+60)*k*k;}else{const k=(s.t-0.15)/0.35;y=top-easeOut(k)*30;al=1-k*k;}
    ctx.globalAlpha=Math.max(0,al);rr(o.x-16,y-20,32,20,6);ctx.fillStyle=C.a;ctx.fill();ctx.globalAlpha=1;}
  ctx.lineWidth=2;ctx.lineCap='round';
  for(const q of sparks){const k=q.life/q.max;ctx.globalAlpha=1-k;ctx.strokeStyle=q.col;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*0.03,q.y-q.vy*0.03);ctx.stroke();}
  ctx.globalAlpha=1;ctx.lineCap='butt';
  ctx.restore();
  // HUD is drawn outside the camera, so it never zooms
  const f='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';ctx.font=f;ctx.textAlign='left';
  ctx.fillStyle=C.mu;ctx.fillText('zoom',16,22);ctx.fillStyle='#17171C';ctx.fillRect(48,15,70,6);
  ctx.fillStyle=C.a;ctx.fillRect(48,15,70*cam.zoom/K.ZOOM_MAX,6);
  ctx.fillStyle=C.ink;ctx.fillText((1+cam.zoom).toFixed(2)+'×  '+(cam.roll*57.3).toFixed(1)+'°',126,22);
  ctx.textAlign='center';ctx.fillStyle=C.mu;ctx.fillText('Click a dummy to hit · mash to stack · Space for random',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
function act(i){slam(i,1);userT=3.5;combo=0;autoT=0.8;}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/S;let bi=0,bd=1e9;
  targets.forEach((o,i)=>{const d=Math.abs(o.x-x);if(d<bd){bd=d;bi=i;}});
  act(bi);e.preventDefault();
});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if(e.repeat)return;
  if(e.key===' '||e.key==='Enter')act(Math.floor(Math.random()*N));
  else if(e.key>='1'&&e.key<=String(N))act(+e.key-1);
});
requestAnimationFrame(frame);
})();
</script></body></html>
