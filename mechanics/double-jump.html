<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Double Jump</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K={
  GRAVITY: 1500,           // px/s² downward acceleration while rising
  FALL_MULT: 1.3,          // × gravity while falling (snappier descent)
  MAX_FALL: 650,           // px/s terminal fall speed
  RUN_SPEED: 150,          // px/s top horizontal speed
  GROUND_ACCEL: 1500,      // px/s² horizontal accel on the ground
  AIR_ACCEL: 1100,         // px/s² horizontal accel in the air
  FRICTION: 2000,          // px/s² braking on the ground with no input
  JUMP_SPEED: 470,         // px/s launch speed of the ground jump
  AIR_JUMP_SPEED: 420,     // px/s launch speed of the air jump (smaller than the first)
  AIR_JUMPS: 1,            // extra jumps allowed before landing
  AIR_JUMP_REDIRECT: 0.7,  // 0–1 how much horizontal speed snaps to the held direction on an air jump
  JUMP_CUT: 0.45,          // × upward speed when jump is released early (variable height)
  COYOTE_TIME: 0.08,       // s after leaving a ledge when the ground jump still works
  JUMP_BUFFER: 0.10,       // s a jump press is remembered before landing
  FLIP_TIME: 0.32,         // s the forward flip on the air jump lasts
  RING_TIME: 0.35,         // s lifetime of the ring puff under the air jump
  RING_RADIUS: 20,         // px final radius of the ring puff
  BODY_W: 18,              // px collision width
  BODY_H: 22,              // px collision height
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280,GY=244,plats=[],route=[];
function layout(){
  const cx=VW/2;GY=VH-36;
  plats=[{x:cx-150,y:GY-50,w:62},{x:cx-45,y:GY-115,w:70},{x:cx+85,y:GY-80,w:70}];
  // autopilot loop: ground left → A → B → C → ground right → C → B → A
  route=[{x:cx-178,s:-1},{x:cx-119,s:0},{x:cx-10,s:1},{x:cx+120,s:2},{x:cx+190,s:-1},{x:cx+120,s:2},{x:cx-10,s:1},{x:cx-119,s:0}];
}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
}
addEventListener('resize',resize);resize();
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const approach=(v,target,step)=>v<target?Math.min(v+step,target):Math.max(v-step,target);

// ---- mechanic ----
const p={x:VW/2-178,y:GY,vx:0,vy:0,face:1,ground:true,coyote:0,buffer:0,airJumps:K.AIR_JUMPS,rising:false,flip:0,sx:1,sy:1};
const input={dir:0,jumpPressed:false,jumpHeld:false};
let parts=[],rings=[],trail=[],trailT=0;

function surfaceAt(x,y0,y1){ // one-way platforms: feet crossing a top while falling
  let best=null;
  for(const q of plats)if(x+K.BODY_W/2>q.x&&x-K.BODY_W/2<q.x+q.w&&y0<=q.y+0.5&&y1>=q.y&&(best===null||q.y<best))best=q.y;
  if(y1>=GY&&best===null)best=GY;
  return best;
}
function dust(x,y,n,col){
  for(let i=0;i<n&&parts.length<50;i++){const d=(i%2?1:-1)*(0.3+Math.random());
    parts.push({x:x+d*4,y:y-1,vx:d*40,vy:-10-Math.random()*30,life:0,max:0.3+Math.random()*0.25,r:1.5+Math.random()*2,col});}
}
function step(dt){
  const dir=input.dir;
  if(dir){p.face=dir;p.vx=approach(p.vx,dir*K.RUN_SPEED,(p.ground?K.GROUND_ACCEL:K.AIR_ACCEL)*dt);}
  else if(p.ground)p.vx=approach(p.vx,0,K.FRICTION*dt);

  p.buffer=input.jumpPressed?K.JUMP_BUFFER:Math.max(0,p.buffer-dt);input.jumpPressed=false;
  p.coyote=p.ground?K.COYOTE_TIME:Math.max(0,p.coyote-dt);
  if(p.ground)p.airJumps=K.AIR_JUMPS;
  if(p.buffer>0){
    if(p.coyote>0){                                   // ground jump: big, plain stretch + dust
      p.vy=-K.JUMP_SPEED;p.ground=false;p.coyote=0;p.buffer=0;p.rising=true;
      p.sx=0.72;p.sy=1.32;dust(p.x,p.y,5,C.ink);sfx(300);
    }else if(p.airJumps>0){                           // air jump: smaller, flips, ring puff, redirects
      p.airJumps--;p.vy=-K.AIR_JUMP_SPEED;p.buffer=0;p.rising=true;p.flip=K.FLIP_TIME;
      if(dir)p.vx+=(dir*K.RUN_SPEED-p.vx)*K.AIR_JUMP_REDIRECT;
      p.sx=0.8;p.sy=1.2;rings.push({x:p.x,y:p.y,t:0});sfx(520);
    }
  }
  // variable height: letting go while rising cuts the upward speed (works for both jumps)
  if(p.rising&&!input.jumpHeld&&p.vy<0){p.vy*=K.JUMP_CUT;p.rising=false;}
  if(p.vy>=0)p.rising=false;
  p.vy=Math.min(K.MAX_FALL,p.vy+K.GRAVITY*(p.vy>0?K.FALL_MULT:1)*dt);
  p.flip=Math.max(0,p.flip-dt);

  p.x+=p.vx*dt;
  if(p.x<K.BODY_W/2){p.x=K.BODY_W/2;p.vx=0;}if(p.x>VW-K.BODY_W/2){p.x=VW-K.BODY_W/2;p.vx=0;}
  const y1=p.y+p.vy*dt,s=p.vy>=0?surfaceAt(p.x,p.y,y1):null;
  if(s!==null){
    if(!p.ground){const k=Math.min(1,p.vy/600);p.sx=1+0.4*k;p.sy=1-0.33*k;dust(p.x,s,2+Math.round(k*5),C.ink);sfx(150);}
    p.y=s;p.vy=0;p.ground=true;p.flip=0;
  }else{p.y=y1;p.ground=false;}
  if(!isFinite(p.x+p.y+p.vx+p.vy)){p.x=VW/2;p.y=GY;p.vx=p.vy=0;}

  const e=Math.min(1,dt*11);p.sx+=(1-p.sx)*e;p.sy+=(1-p.sy)*e;
  trailT+=dt;if(trailT>0.03){trailT=0;trail.push({x:p.x,y:p.y-K.BODY_H/2});if(trail.length>22)trail.shift();}
  for(const q of parts){q.life+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-Math.min(1,dt*4);q.vy*=1-Math.min(1,dt*3);}
  parts=parts.filter(q=>q.life<q.max);
  for(const r of rings)r.t+=dt;rings=rings.filter(r=>r.t<K.RING_TIME);
}
function drawPlayer(){
  // ring puff: flat ellipse expanding under the feet where the air jump happened
  for(const r of rings){const k=r.t/K.RING_TIME,ek=1-(1-k)*(1-k);ctx.globalAlpha=1-k;ctx.strokeStyle=C.y;ctx.lineWidth=2*(1-k)+0.5;
    ctx.beginPath();ctx.ellipse(r.x,r.y+4*ek,6+ek*K.RING_RADIUS,2+ek*K.RING_RADIUS*0.3,0,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(p.x,p.y-K.BODY_H/2);
  if(p.flip>0){const k=1-p.flip/K.FLIP_TIME;ctx.rotate(p.face*6.283*(1-(1-k)*(1-k)));}  // eased full flip
  ctx.translate(0,K.BODY_H/2);ctx.scale(p.sx,p.sy);
  rr(-K.BODY_W/2,-K.BODY_H,K.BODY_W,K.BODY_H,6);ctx.fillStyle=C.a;ctx.fill();
  ctx.fillStyle=C.ink;const ex=p.face*2.5;
  rr(ex-5,-K.BODY_H+6,3,4.5,1.5);ctx.fill();rr(ex+2,-K.BODY_H+6,3,4.5,1.5);ctx.fill();
  ctx.restore();
  // pips above the head: one per air jump, hollow once spent
  for(let i=0;i<K.AIR_JUMPS;i++){const px=p.x+(i-(K.AIR_JUMPS-1)/2)*7,py=p.y-K.BODY_H-9;
    ctx.beginPath();ctx.arc(px,py,2.2,0,6.283);
    if(i<p.airJumps){ctx.fillStyle=C.ink;ctx.fill();}else{ctx.strokeStyle=C.mu;ctx.lineWidth=1;ctx.stroke();}}
}

// ---- demo ----
const keys={},ptr={down:false,x:0};
let userT=0,AC=null;
const ai={i:1,wait:0.2,hold:0,stuck:0,startY:GY};
function sfx(f){
  if(!AC||userT<=0)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.4,t+0.07);
  g.gain.setValueAtTime(0.045,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+0.1);
}
function autopilot(dt){
  const w=route[ai.i%route.length],ty=w.s<0?GY:plats[w.s].y,dx=w.x-p.x;
  input.dir=0;
  if(ai.wait>0){ai.wait-=dt;input.jumpHeld=false;return;}
  ai.stuck+=dt;
  const onTarget=p.ground&&Math.abs(p.y-ty)<1;
  if((onTarget&&Math.abs(dx)<10)||ai.stuck>5){ai.i=(ai.i+1)%route.length;ai.stuck=0;ai.wait=0.2+Math.random()*0.2;return;}
  if(Math.abs(dx)>4)input.dir=Math.sign(dx);
  if(p.ground&&!onTarget&&Math.abs(dx)<100){         // take off: short hop if the step up is small
    input.jumpPressed=true;ai.startY=p.y;const rise=p.y-ty;ai.hold=rise>0&&rise<60?0.17:1;
  }else if(!p.ground&&p.airJumps>0&&p.vy>-60){       // near the apex: air jump if still short of the target
    const q=plats[w.s],over=q&&p.x>q.x-6&&p.x<q.x+q.w+6&&p.y<=ty;   // already above the target: just land
    const needHeight=ty<ai.startY&&p.y>ty-2&&!over,needDist=Math.abs(dx)>60;
    if(needHeight||needDist){input.jumpPressed=true;ai.hold=1;}
  }
  if(ai.hold>0){ai.hold-=dt;input.jumpHeld=true;}else input.jumpHeld=false;
}
function update(dt){
  if(userT>0){
    userT-=dt;
    let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
    if(ptr.down&&Math.abs(ptr.x-p.x)>12)dir=Math.sign(ptr.x-p.x);
    input.dir=dir;input.jumpHeld=!!(keys[' ']||keys.ArrowUp||keys.w||ptr.down);
    if(dir||input.jumpHeld)userT=Math.max(userT,3.5);
    if(userT<=0){ai.wait=0.3;ai.hold=0;ai.stuck=0;}
  }else autopilot(dt);
  step(dt);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  ctx.fillStyle='#131317';ctx.fillRect(0,GY,VW,VH-GY);
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(VW,GY);ctx.stroke();
  for(const q of plats){rr(q.x,q.y,q.w,9,4.5);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.mu;ctx.stroke();
    ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(q.x+4,q.y);ctx.lineTo(q.x+q.w-4,q.y);ctx.stroke();}
  // faint arc trail shows short hops vs full jumps vs double jumps
  trail.forEach((t,i)=>{ctx.globalAlpha=i/trail.length*0.5;ctx.fillStyle=C.mu;ctx.fillRect(t.x-1,t.y-1,2,2);});
  for(const q of parts){const k=q.life/q.max;ctx.globalAlpha=(1-k)*0.8;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1-k*0.6),0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  const sy=surfaceAt(p.x,p.y,9999);if(sy!==null){const k=Math.max(0.3,1-(sy-p.y)/120);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(p.x,sy+2,9*k,2.2*k,0,0,6.283);ctx.fill();}
  drawPlayer();
  ctx.font='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';ctx.textAlign='center';ctx.fillStyle=C.mu;
  ctx.fillText('←/→ move · Space or tap to jump, again in the air · hold for height',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
function wake(){
  userT=3.5;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(['ArrowLeft','ArrowRight','a','d',' ','ArrowUp','w'].includes(k)){keys[k]=true;wake();}
  if([' ','ArrowUp','w'].includes(k)&&!e.repeat)input.jumpPressed=true;
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;ptr.down=false;});
function pp(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)/S;}
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=true;input.jumpPressed=true;wake();e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(ptr.down)pp(e);});
addEventListener('pointerup',()=>{ptr.down=false;});addEventListener('pointercancel',()=>{ptr.down=false;});
requestAnimationFrame(frame);
})();
</script></body></html>
