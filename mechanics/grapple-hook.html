<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grapple Hook</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280,anchors=[];
function layout(){
  const n=Math.max(3,Math.min(6,Math.floor(VW/108))),gap=Math.min(118,(VW-90)/(n-1)),x0=VW/2-gap*(n-1)/2;
  anchors=[];for(let i=0;i<n;i++)anchors.push({x:x0+i*gap,y:VH*0.2+(i%2?16:0),pulse:0});
}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
  if(rope&&rope.i>=anchors.length)rope.i=anchors.length-1;
}
const GRAV=900,SHOOT=0.07;
const p={x:0,y:0,vx:120,vy:0,rot:0};
let rope=null,trail=[],fx=[],userT=0,time=0,freeT=0,lastI=0,pump=0;
const ai={dir:1},keys={};
addEventListener('resize',resize);resize();
p.x=anchors[0].x-50;p.y=anchors[0].y+80;

function nearest(x,y){let b=0,bd=1e9;anchors.forEach((a,i)=>{const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;b=i;}});return b;}
function grapple(i){i=Math.max(0,Math.min(anchors.length-1,i));rope={i,t:0,on:false,L:90};lastI=i;}
function release(){
  if(!rope)return;
  if(rope.on){fx.push({x:p.x,y:p.y,t:0,a:Math.atan2(p.vy,p.vx)});}
  rope=null;freeT=0;
}
function step(dt){
  p.vy+=GRAV*dt;
  if(rope&&rope.on){
    const a=anchors[rope.i];let dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy)||1;
    const tx=-dy/d,ty=dx/d,vt=p.vx*tx+p.vy*ty;                 // tangent: pump the swing
    if(pump&&vt*pump*tx>=0&&Math.abs(tx)>0.3){const s=Math.sign(tx)*pump;p.vx+=tx*s*300*dt;p.vy+=ty*s*300*dt;}
    if(rope.L>92)rope.L=Math.max(92,rope.L-70*dt);             // reel in
  }
  const dmp=1-0.08*dt;p.vx*=dmp;p.vy*=dmp;
  const sp=Math.hypot(p.vx,p.vy);if(sp>560){p.vx*=560/sp;p.vy*=560/sp;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(rope&&rope.on){                                          // rope constraint (taut only)
    const a=anchors[rope.i],dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy)||1;
    if(d>rope.L){const nx=dx/d,ny=dy/d;p.x=a.x+nx*rope.L;p.y=a.y+ny*rope.L;const vr=p.vx*nx+p.vy*ny;if(vr>0){p.vx-=nx*vr;p.vy-=ny*vr;}}
  }
  if(p.x<8){p.x=8;p.vx=Math.abs(p.vx)*0.5;}if(p.x>VW-8){p.x=VW-8;p.vx=-Math.abs(p.vx)*0.5;}
}
function think(dt){
  pump=0;
  if(userT>0){userT-=dt;pump=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);
    if(userT<=0)ai.dir=p.vx>=0?1:-1;}
  else if(rope&&rope.on){
    const n=anchors.length;if(rope.i+ai.dir<0||rope.i+ai.dir>=n)ai.dir=-ai.dir;
    pump=ai.dir;const a=anchors[rope.i];
    if(p.vx*ai.dir>60&&(p.x-a.x)*ai.dir>rope.L*0.5&&p.vy<0)release();
  }else if(!rope){
    const t=anchors[Math.max(0,Math.min(anchors.length-1,lastI+ai.dir))],d=Math.hypot(t.x-p.x,t.y-p.y);
    if((p.vy>=-20&&d<150)||d<70)grapple(anchors.indexOf(t));
  }
  // safety line: never fall out of the scene
  if(!rope){freeT+=dt;if(p.y>VH-26||(userT<=0&&freeT>1.1))grapple(nearest(p.x,p.y-60));}
}
function update(dt){
  time+=dt;think(dt);
  if(rope&&!rope.on){rope.t+=dt;if(rope.t>=SHOOT){const a=anchors[rope.i];rope.on=true;rope.L=Math.max(45,Math.min(165,Math.hypot(p.x-a.x,p.y-a.y)));a.pulse=1;}}
  step(dt/2);step(dt/2);
  if(!isFinite(p.x+p.y+p.vx+p.vy)){p.x=anchors[0].x;p.y=anchors[0].y+80;p.vx=100;p.vy=0;rope=null;}
  const sp=Math.hypot(p.vx,p.vy),ta=Math.atan2(p.vy,p.vx);
  if(sp>30){let da=ta-p.rot;da=Math.atan2(Math.sin(da),Math.cos(da));p.rot+=da*Math.min(1,dt*14);}
  trail.push({x:p.x,y:p.y});if(trail.length>18)trail.shift();
  for(const a of anchors)a.pulse=Math.max(0,a.pulse-dt*3);
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<0.3);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  // trail
  ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){const k=i/trail.length;ctx.globalAlpha=k*0.5;ctx.strokeStyle=C.a;ctx.lineWidth=k*7;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();}
  ctx.globalAlpha=1;
  // rope
  if(rope){const a=anchors[rope.i],k=rope.on?1:Math.min(1,rope.t/SHOOT),ex=p.x+(a.x-p.x)*k,ey=p.y+(a.y-p.y)*k;
    const d=Math.hypot(a.x-p.x,a.y-p.y),slack=rope.on?Math.max(0,rope.L-d):0;
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x,p.y);
    ctx.quadraticCurveTo((p.x+ex)/2,(p.y+ey)/2+slack*0.9,ex,ey);ctx.stroke();
    ctx.fillStyle=C.y;ctx.beginPath();ctx.arc(ex,ey,2.6,0,6.283);ctx.fill();}
  // anchors
  for(let i=0;i<anchors.length;i++){const a=anchors[i],on=rope&&rope.on&&rope.i===i;
    ctx.strokeStyle=on?C.y:C.mu;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(a.x,a.y,6,0,6.283);ctx.stroke();
    ctx.fillStyle=on?C.y:C.ink;ctx.beginPath();ctx.arc(a.x,a.y,2.2,0,6.283);ctx.fill();
    if(a.pulse>0){const k=1-a.pulse;ctx.globalAlpha=a.pulse;ctx.strokeStyle=C.y;ctx.beginPath();ctx.arc(a.x,a.y,6+k*16,0,6.283);ctx.stroke();ctx.globalAlpha=1;}}
  // release fling fx
  for(const f of fx){const k=f.t/0.3,e=1-(1-k)*(1-k);ctx.globalAlpha=1-k;ctx.strokeStyle=C.y;ctx.lineWidth=1.5;
    for(let j=-1;j<=1;j++){const a=f.a+Math.PI+j*0.5,r0=8+e*10,r1=r0+10*(1-k);ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*r0,f.y+Math.sin(a)*r0);ctx.lineTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1);ctx.stroke();}}
  ctx.globalAlpha=1;ctx.lineCap='butt';
  // player: stretches along velocity
  const sp=Math.hypot(p.vx,p.vy),st=Math.min(0.3,sp/1500);
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1+st,1-st*0.7);
  ctx.fillStyle=C.a;ctx.beginPath();ctx.arc(0,0,9,0,6.283);ctx.fill();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(4,-3,1.8,0,6.283);ctx.arc(4,3,1.8,0,6.283);ctx.fill();
  ctx.restore();
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.033);
  update(dt);draw();
}
// hold pointer / space = grapple, let go = release fling
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();userT=5;grapple(nearest((e.clientX-r.left)/S,(e.clientY-r.top)/S));e.preventDefault();});
addEventListener('pointerup',()=>{if(userT>0){userT=5;release();}});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k===' '&&!e.repeat){userT=5;const d=p.vx>=0?1:-1;grapple(nearest(p.x+d*70,p.y-90));}
  if(['ArrowLeft','ArrowRight','a','d'].includes(k)){keys[k]=true;userT=5;}
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k===' '&&userT>0){userT=5;release();}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
requestAnimationFrame(frame);
})();
</script></body></html>
