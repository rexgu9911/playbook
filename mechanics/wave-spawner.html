<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wave Spawner</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K = {
  WAVES: 5,              // waves before the demo loops back to wave 1
  BASE_COUNT: 3,         // enemies in wave 1
  COUNT_GROWTH: 2,       // extra enemies added per wave
  BASE_SPEED: 30,        // px/s enemy speed in wave 1
  SPEED_GROWTH: 1.15,    // enemy speed multiplier per wave
  BASE_INTERVAL: 0.9,    // s between spawns in wave 1
  INTERVAL_DECAY: 0.85,  // spawn interval multiplier per wave
  MIN_INTERVAL: 0.3,     // s floor for the spawn interval
  TELEGRAPH: 0.8,        // s the warning marker shows before its enemy appears
  TELEGRAPH_R: 18,       // px warning ring start radius (shrinks to the enemy size)
  BREATHER: 2.4,         // s pause between waves (the wave banner shows here)
  BANNER_SLIDE: 0.35,    // s banner slide-in and slide-out
  SPAWN_RX: 190,         // px spawn ellipse horizontal radius around the base
  SPAWN_RY: 105,         // px spawn ellipse vertical radius around the base
  SPAWN_MIN_GAP: 0.5,    // rad min angle between pending telegraphs
  ENEMY_R: 7,            // px enemy radius
  BASE_R: 14,            // px turret radius (an enemy touching it leaks)
  FIRE_RATE: 4,          // shots/s
  TURN_RATE: 8,          // rad/s turret turn speed
  BULLET_SPEED: 380,     // px/s
  MAX_PARTS: 80,         // particle cap
  ATTRACT_IDLE: 3.5,     // s after user input before the turret aims itself again
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const FONT='ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280,CX=220,CY=144;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),eo=k=>1-Math.pow(1-clamp(k,0,1),3);

// ---- mechanic ----
// Difficulty curve: count grows linearly, speed grows geometrically, spawn interval shrinks to a floor.
function waveStats(w){   // w is 1-based
  return {count:K.BASE_COUNT+K.COUNT_GROWTH*(w-1),
          speed:K.BASE_SPEED*Math.pow(K.SPEED_GROWTH,w-1),
          interval:Math.max(K.MIN_INTERVAL,K.BASE_INTERVAL*Math.pow(K.INTERVAL_DECAY,w-1))};
}
// States: breather (banner, no spawns) -> spawning (telegraph, then enemy) -> clearing (wait for 0 alive) -> breather
const spawner={wave:1,state:'breather',t:K.BREATHER*0.45,toSpawn:0,spawnT:0,stats:waveStats(1),telegraphs:[],cleared:0};
function pickSpawnPoint(){   // random angle on the ellipse, kept apart from other pending telegraphs
  let a=0;
  for(let i=0;i<8;i++){a=Math.random()*Math.PI*2;
    if(spawner.telegraphs.every(g=>Math.abs(Math.atan2(Math.sin(a-g.a),Math.cos(a-g.a)))>K.SPAWN_MIN_GAP))break;}
  return {a,x:CX+Math.cos(a)*K.SPAWN_RX,y:CY+Math.sin(a)*K.SPAWN_RY};
}
function stepSpawner(dt,alive,spawnEnemy){
  const s=spawner;s.t+=dt;
  if(s.state==='breather'){
    if(s.t>=K.BREATHER){s.state='spawning';s.t=0;s.stats=waveStats(s.wave);s.toSpawn=s.stats.count;s.spawnT=0;}
  }else if(s.state==='spawning'){
    s.spawnT-=dt;
    if(s.toSpawn>0&&s.spawnT<=0){s.telegraphs.push(Object.assign(pickSpawnPoint(),{t:0}));s.toSpawn--;s.spawnT=s.stats.interval;}
    if(s.toSpawn===0&&s.telegraphs.length===0)s.state='clearing';
  }else if(s.state==='clearing'&&alive===0){
    s.cleared=s.wave;s.wave=s.wave%K.WAVES+1;s.state='breather';s.t=0;s.stats=waveStats(s.wave);
  }
  for(const g of s.telegraphs){g.t+=dt;if(g.t>=K.TELEGRAPH)spawnEnemy(g.x,g.y,s.stats.speed);}  // warning over: enemy appears
  s.telegraphs=s.telegraphs.filter(g=>g.t<K.TELEGRAPH);
}
function drawTelegraph(g){
  const k=g.t/K.TELEGRAPH,r=K.TELEGRAPH_R+(K.ENEMY_R-K.TELEGRAPH_R)*eo(k);
  const on=Math.sin(g.t*(14+30*k))>0;                  // blink speeds up as the spawn gets close
  ctx.strokeStyle=C.a;ctx.lineWidth=1.5;ctx.globalAlpha=on?1:0.4;
  ctx.beginPath();ctx.arc(g.x,g.y,r,0,6.283);ctx.stroke();
  for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;ctx.beginPath();ctx.moveTo(g.x+Math.cos(a)*(r+3),g.y+Math.sin(a)*(r+3));ctx.lineTo(g.x+Math.cos(a)*(r+7),g.y+Math.sin(a)*(r+7));ctx.stroke();}
  ctx.fillStyle=C.a;ctx.fillRect(g.x-1,g.y-5,2,6);ctx.fillRect(g.x-1,g.y+2.5,2,2);
  ctx.globalAlpha=1;
}
function drawBanner(){           // slides in, holds, slides out across the breather
  const s=spawner;if(s.state!=='breather')return;
  const kin=eo(s.t/K.BANNER_SLIDE),kout=eo((s.t-(K.BREATHER-K.BANNER_SLIDE))/K.BANNER_SLIDE);
  const x=CX+(1-kin)*-VW*0.6+kout*VW*0.6,y=CY-4,al=Math.min(kin,1-kout);
  ctx.globalAlpha=al;ctx.fillStyle='rgba(13,13,16,.85)';ctx.fillRect(x-110,y-34,220,62);
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(s.cleared){ctx.font='700 9px '+FONT;ctx.fillStyle=C.y;ctx.fillText('WAVE '+s.cleared+' CLEARED',x,y-24);}
  ctx.font='800 24px '+FONT;ctx.fillStyle=C.ink;ctx.fillText('WAVE '+s.wave,x,y-4);
  ctx.fillStyle=C.a;ctx.fillRect(x-24,y+11,48,2);
  ctx.font='9px '+FONT;ctx.fillStyle=C.mu;ctx.fillText(s.stats.count+' ENEMIES · SPEED '+Math.round(s.stats.speed),x,y+21);
  ctx.globalAlpha=1;
}

// ---- demo ----
let enemies=[],bullets=[],parts=[],userT=0,aimX=0,aimY=0;
const tur={ang:-Math.PI/2,cool:0,flash:0};
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);
  const ox=CX,oy=CY;VW=W/S;VH=H/S;CX=VW/2;CY=VH/2+4;
  const dx=CX-ox,dy=CY-oy;for(const o of [...enemies,...bullets,...spawner.telegraphs]){o.x+=dx;o.y+=dy;}
}
addEventListener('resize',resize);resize();
function burst(x,y,n,col){for(let i=0;i<n&&parts.length<K.MAX_PARTS;i++){const a=Math.random()*6.283,v=40+Math.random()*120;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:0.3+Math.random()*0.3,col:i%2?col:C.mu});}}
function fire(){
  if(tur.cool>0)return;tur.cool=1/K.FIRE_RATE;
  const c=Math.cos(tur.ang),s=Math.sin(tur.ang);
  bullets.push({x:CX+c*18,y:CY+s*18,vx:c*K.BULLET_SPEED,vy:s*K.BULLET_SPEED});
}
function update(dt){
  if(userT>0)userT-=dt;
  stepSpawner(dt,enemies.length,(x,y,speed)=>{enemies.push({x,y,speed,pop:0});burst(x,y,5,C.a);});
  // turret: auto-aims at the nearest enemy, or at the pointer while the user is in control
  let tx=null,ty=null;
  if(userT>0){tx=aimX;ty=aimY;}
  else{let bd=1e9;for(const e of enemies){const d=Math.hypot(e.x-CX,e.y-CY);if(d<bd){bd=d;tx=e.x;ty=e.y;}}}
  tur.cool=Math.max(0,tur.cool-dt);tur.flash=Math.max(0,tur.flash-dt*3);
  if(tx!==null){
    const want=Math.atan2(ty-CY,tx-CX),diff=Math.atan2(Math.sin(want-tur.ang),Math.cos(want-tur.ang));
    tur.ang+=clamp(diff,-K.TURN_RATE*dt,K.TURN_RATE*dt);
    if(userT<=0&&Math.abs(diff)<0.12)fire();
  }
  for(const e of enemies){const dx=CX-e.x,dy=CY-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.pop=Math.min(1,e.pop+dt*6);
    if(d<K.BASE_R+K.ENEMY_R){e.dead=true;tur.flash=1;burst(e.x,e.y,8,C.ink);}}   // leaked into the base
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const e of enemies)if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<K.ENEMY_R+2){e.dead=true;b.dead=true;burst(e.x,e.y,9,C.y);break;}
    if(b.x<-20||b.y<-20||b.x>VW+20||b.y>VH+20)b.dead=true;}
  enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);
  for(const p of parts){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-Math.min(1,dt*4);p.vy*=1-Math.min(1,dt*4);}
  parts=parts.filter(p=>p.life<p.max);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  ctx.strokeStyle='#1F1F26';ctx.lineWidth=1;ctx.setLineDash([2,5]);ctx.beginPath();ctx.ellipse(CX,CY,K.SPAWN_RX,K.SPAWN_RY,0,0,6.283);ctx.stroke();ctx.setLineDash([]);
  for(const g of spawner.telegraphs)drawTelegraph(g);
  for(const e of enemies){const s=0.4+0.6*eo(e.pop),r=K.ENEMY_R*s,a=Math.atan2(CY-e.y,CX-e.x);
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a+Math.PI/4);ctx.fillStyle='#17171C';ctx.fillRect(-r,-r,r*2,r*2);
    ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.strokeRect(-r,-r,r*2,r*2);ctx.restore();}
  ctx.strokeStyle=C.y;ctx.lineWidth=2;ctx.lineCap='round';
  for(const b of bullets){ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.02,b.y-b.vy*0.02);ctx.stroke();}
  ctx.lineCap='butt';
  for(const p of parts){ctx.globalAlpha=1-p.life/p.max;ctx.fillStyle=p.col;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}ctx.globalAlpha=1;
  // turret
  ctx.fillStyle='#17171C';ctx.beginPath();ctx.arc(CX,CY,K.BASE_R,0,6.283);ctx.fill();ctx.strokeStyle=C.mu;ctx.lineWidth=1.5;ctx.stroke();
  ctx.save();ctx.translate(CX,CY);ctx.rotate(tur.ang);ctx.fillStyle=C.ink;ctx.fillRect(4,-2.5,16-tur.cool*K.FIRE_RATE*4,5);ctx.restore();
  ctx.fillStyle=tur.flash>0?C.ink:C.a;ctx.beginPath();ctx.arc(CX,CY,5,0,6.283);ctx.fill();
  if(tur.flash>0){ctx.globalAlpha=tur.flash;ctx.strokeStyle=C.a;ctx.beginPath();ctx.arc(CX,CY,K.BASE_R+(1-tur.flash)*14,0,6.283);ctx.stroke();ctx.globalAlpha=1;}
  drawBanner();
  // HUD: wave + difficulty curve (bar = count, dot = speed)
  const s=spawner;ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='700 10px '+FONT;ctx.fillStyle=C.ink;
  ctx.fillText('WAVE '+s.wave+'/'+K.WAVES,14,16);ctx.font='9px '+FONT;ctx.fillStyle=C.mu;
  ctx.fillText(s.state==='breather'?'breather':(enemies.length+s.toSpawn+s.telegraphs.length)+' left',14,29);
  const top=waveStats(K.WAVES);
  for(let w=1;w<=K.WAVES;w++){const st=waveStats(w),bx=VW-14-(K.WAVES-w+1)*12,bh=st.count/top.count*22;
    ctx.fillStyle=w===s.wave?C.a:'#2A2A32';ctx.fillRect(bx,34-bh,8,bh);
    ctx.fillStyle=w===s.wave?C.ink:C.mu;ctx.fillRect(bx+3,34-st.speed/top.speed*22-5,2,2);}
  ctx.textAlign='right';ctx.fillStyle=C.mu;ctx.fillText('difficulty',VW-14,44);
  ctx.textAlign='center';ctx.font='10px '+FONT;ctx.fillText('Click to aim and fire · waves loop',VW/2,VH-12);
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let dt=last?(t-last)/1000:0.016;last=t;if(!(dt>0))dt=0.016;dt=Math.min(dt,0.05);
  update(dt);draw();
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();aimX=(e.clientX-r.left)/S;aimY=(e.clientY-r.top)/S;userT=K.ATTRACT_IDLE;
  tur.ang=Math.atan2(aimY-CY,aimX-CX);fire();e.preventDefault();      // manual shot snaps straight to the pointer
});
cv.addEventListener('pointermove',e=>{if(userT<=0)return;const r=cv.getBoundingClientRect();aimX=(e.clientX-r.left)/S;aimY=(e.clientY-r.top)/S;});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if((e.key===' '||e.key==='Enter')&&!e.repeat){
    let bd=1e9;for(const en of enemies){const d=Math.hypot(en.x-CX,en.y-CY);if(d<bd){bd=d;aimX=en.x;aimY=en.y;}}
    if(bd<1e9){userT=K.ATTRACT_IDLE;tur.ang=Math.atan2(aimY-CY,aimX-CX);fire();}
  }
});
requestAnimationFrame(frame);
})();
</script></body></html>
