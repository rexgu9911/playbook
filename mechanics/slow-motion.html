<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slow Motion</title>
<style>html,body{margin:0;height:100%;background:#0D0D10;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
(()=>{
const K={
  MIN_SCALE: 0.1,       // world time scale at the bottom of the slow-mo (0–1)
  EASE_IN: 0.15,        // s (real time) to brake from the current speed down to MIN_SCALE
  HOLD: 1.1,            // s (real time) held at MIN_SCALE
  EASE_OUT: 0.7,        // s (real time) to ramp back up to 1
  BARS: 14,             // px letterbox bar height at full slow-mo (0 = off)
  WASH: 0.35,           // 0–1 opacity of the dark wash over the world at full slow-mo
};
const C={bg:'#0D0D10',dot:'#1A1A20',a:'#FF4D2E',y:'#F5E663',ink:'#F4F1EA',mu:'#6B6B76'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=300,H=200,D=1,S=1,VW=440,VH=280;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOut=k=>1-Math.pow(1-k,3),easeIn=k=>k*k*k;

// ---- mechanic ----
// One clock drives everything: each frame, worldDt = realDt * slow.scale.
// Gameplay/physics/world particles use worldDt; UI, HUD and "juice" particles keep using realDt.
const slow={t:-1,from:1,scale:1};          // t = real seconds since trigger (-1 = idle)
function triggerSlowmo(){slow.t=0;slow.from=slow.scale;}   // re-trigger brakes from the current scale, no pop
function updateSlowmo(realDt){
  if(slow.t<0)return slow.scale=1;
  slow.t+=realDt;const t=slow.t,hold=K.EASE_IN+K.HOLD,end=hold+K.EASE_OUT;
  if(t<K.EASE_IN)slow.scale=lerp(slow.from,K.MIN_SCALE,easeOut(t/K.EASE_IN));   // brake hard
  else if(t<hold)slow.scale=K.MIN_SCALE;
  else if(t<end)slow.scale=lerp(K.MIN_SCALE,1,easeIn((t-hold)/K.EASE_OUT));      // creep, then snap back to speed
  else{slow.scale=1;slow.t=-1;}
  return slow.scale;
}
const slowAmount=()=>(1-slow.scale)/(1-K.MIN_SCALE);   // 0 normal .. 1 full slow-mo: drives the visual cues
function drawSlowmoOverlay(){                           // screen space, after the world, before the HUD
  const a=slowAmount();if(a<=0)return;
  ctx.globalAlpha=K.WASH*a;ctx.fillStyle=C.bg;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1;
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,K.BARS*a);ctx.fillRect(0,VH-K.BARS*a,VW,K.BARS*a);
}

// ---- demo ----
let GY=200,PX=100,worldT=0,realT=0,userT=0,fireT=0.25,respawnT=-1;
let enemies=[],shots=[],debris=[],sparkles=[],banner=null,graph=[],graphAcc=0;
function layout(){GY=VH-70;PX=VW/2-150;}
function resize(){
  D=Math.min(2,window.devicePixelRatio||1);W=Math.max(40,innerWidth||300);H=Math.max(40,innerHeight||200);
  cv.width=Math.round(W*D);cv.height=Math.round(H*D);S=Math.min(W/440,H/280);VW=W/S;VH=H/S;layout();
  enemies.forEach((e,i)=>{if(e.alive)e.x=ex(i);});
}
const ex=i=>VW/2+10+i*62;
function spawn(){shots=[];enemies=[0,1,2].map(i=>({x:ex(i),y:GY,vx:0,vy:0,rot:0,rv:0,alive:true,born:0,flash:0,gone:false}));}
addEventListener('resize',resize);resize();spawn();
function fire(){const e=enemies.find(o=>o.alive&&!o.targeted);if(!e)return;e.targeted=true;
  shots.push({x:PX+14,y:GY-14,target:e,trail:[]});}
function burst(x,y,n,pow){for(let i=0;i<n&&debris.length<70;i++){const a=-Math.PI*Math.random(),sp=(80+Math.random()*260)*pow;
  debris.push({x,y,vx:Math.cos(a)*sp+60*pow,vy:Math.sin(a)*sp,rot:Math.random()*6,rv:(Math.random()-0.5)*16,life:0,max:0.9+Math.random()*0.8,w:2+Math.random()*4,col:i%3?C.mu:C.ink});}}
function hit(e){
  e.alive=false;e.flash=1;
  const last=!enemies.some(o=>o.alive);
  if(last){                                            // final hit -> bullet time
    triggerSlowmo();e.vx=170;e.vy=-330;e.rv=9;burst(e.x,e.y-16,26,1.3);
    banner={t:0};for(let i=0;i<14;i++)sparkles.push({a:i/14*6.283,r:0,life:0});
  }else{e.vx=90;e.vy=-160;e.rv=5;burst(e.x,e.y-16,8,0.8);}
}
function updateWorld(dt){                               // everything here runs on SCALED time
  worldT+=dt;
  if(userT<=0&&enemies.some(o=>o.alive)){fireT-=dt;if(fireT<=0){fire();fireT=0.45;}}
  for(const s of shots){const tx=s.target.x-12;s.x+=620*dt;s.trail.push([s.x,s.y]);if(s.trail.length>8)s.trail.shift();
    if(s.x>=tx){s.done=true;hit(s.target);}}
  shots=shots.filter(s=>!s.done);
  for(const e of enemies){e.flash=Math.max(0,e.flash-dt*6);
    if(!e.alive&&!e.gone){e.vy+=900*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.rv*dt;if(e.y>VH+60)e.gone=true;}}
  for(const q of debris){q.life+=dt;q.vy+=700*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.rv*dt;if(q.y>GY&&q.vy>0){q.y=GY;q.vy*=-0.35;q.vx*=0.6;q.rv*=0.5;}}
  debris=debris.filter(q=>q.life<q.max);
}
function updateUI(rdt){                                 // everything here runs on REAL time
  realT+=rdt;if(userT>0)userT-=rdt;
  if(banner){banner.t+=rdt;if(banner.t>1.9)banner=null;}
  for(const p of sparkles){p.life+=rdt;p.r=easeOut(Math.min(1,p.life/0.5))*70;}
  sparkles=sparkles.filter(p=>p.life<0.9);
  for(const e of enemies)if(e.alive&&e.born<1)e.born=Math.min(1,e.born+rdt*4);
  if(!enemies.some(o=>o.alive)&&slow.t<0){if(respawnT<0)respawnT=0.9;respawnT-=rdt;if(respawnT<=0){respawnT=-1;spawn();fireT=0.5;}}
  graphAcc+=rdt;while(graphAcc>1/30){graphAcc-=1/30;graph.push(slow.scale);if(graph.length>96)graph.shift();}
}
function dial(x,y,t,label,col){
  ctx.strokeStyle=C.mu;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,9,0,6.283);ctx.stroke();
  const a=t*Math.PI-Math.PI/2;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*7,y+Math.sin(a)*7);ctx.stroke();ctx.lineCap='butt';
  ctx.fillStyle=C.mu;ctx.textAlign='left';ctx.fillText(label,x+15,y+3.5);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(D*S,0,0,D*S,0,0);
  ctx.fillStyle=C.dot;for(let x=10;x<VW;x+=20)for(let y=10;y<VH;y+=20)ctx.fillRect(x-0.75,y-0.75,1.5,1.5);
  ctx.fillStyle='#131317';ctx.fillRect(0,GY,VW,VH-GY);
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(VW,GY);ctx.stroke();
  // player
  rr(PX-10,GY-24,20,24,7);ctx.fillStyle=C.a;ctx.fill();ctx.fillStyle=C.ink;rr(PX+1,GY-18,3,4.5,1.5);ctx.fill();rr(PX+6,GY-18,3,4.5,1.5);ctx.fill();
  // enemies
  for(const e of enemies){if(e.gone)continue;const s=e.alive?easeOut(e.born):1;
    ctx.save();ctx.translate(e.x,e.y-15);ctx.rotate(e.rot);ctx.scale(s,s);
    rr(-12,-15,24,30,7);ctx.fillStyle='#17171C';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=C.mu;ctx.fillRect(-6,-6,3,4);ctx.fillRect(3,-6,3,4);
    if(e.flash>0){ctx.globalAlpha=e.flash;rr(-12,-15,24,30,7);ctx.fillStyle=C.ink;ctx.fill();ctx.globalAlpha=1;}
    ctx.restore();}
  // shots + world debris
  ctx.lineCap='round';
  for(const s of shots){ctx.strokeStyle=C.ink;for(let i=1;i<s.trail.length;i++){ctx.globalAlpha=i/s.trail.length;ctx.lineWidth=3*i/s.trail.length;
    ctx.beginPath();ctx.moveTo(s.trail[i-1][0],s.trail[i-1][1]);ctx.lineTo(s.trail[i][0],s.trail[i][1]);ctx.stroke();}}
  ctx.globalAlpha=1;ctx.lineCap='butt';
  for(const q of debris){ctx.globalAlpha=1-Math.pow(q.life/q.max,3);ctx.fillStyle=q.col;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillRect(-q.w/2,-q.w/2,q.w,q.w);ctx.restore();}
  ctx.globalAlpha=1;
  drawSlowmoOverlay();
  // ---- real-time layer: banner + sparkles keep full speed during slow-mo ----
  ctx.font='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
  if(banner){const bx=VW/2+60,by=VH/2-52,k=banner.t,pop=k<0.12?easeOut(k/0.12)*1.25:lerp(1.25,1,Math.min(1,(k-0.12)/0.15));
    ctx.globalAlpha=k>1.5?Math.max(0,1-(k-1.5)/0.4):1;
    ctx.strokeStyle=C.y;ctx.lineWidth=1.5;
    for(const p of sparkles){const sx=bx+Math.cos(p.a)*p.r,sy=by+Math.sin(p.a)*p.r*0.5,z=3*(1-p.life/0.9);
      ctx.beginPath();ctx.moveTo(sx-z,sy);ctx.lineTo(sx+z,sy);ctx.moveTo(sx,sy-z);ctx.lineTo(sx,sy+z);ctx.stroke();}
    ctx.save();ctx.translate(bx,by);ctx.scale(pop,pop);ctx.font='bold 22px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
    ctx.textAlign='center';ctx.fillStyle=C.ink;ctx.fillText('FINAL HIT',0,8);ctx.restore();ctx.globalAlpha=1;}
  // HUD: two clocks + a scale graph
  ctx.font='10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
  dial(26,26,worldT,'world (scaled)',C.a);dial(26,50,realT,'real time',C.ink);
  const gx=VW-120,gy=16,gw=100,gh=30;
  ctx.strokeStyle=C.dot;ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
  ctx.setLineDash([2,3]);ctx.strokeStyle=C.mu;ctx.beginPath();const my=gy+gh*(1-K.MIN_SCALE);ctx.moveTo(gx,my);ctx.lineTo(gx+gw,my);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=C.a;ctx.lineWidth=1.5;ctx.beginPath();
  graph.forEach((v,i)=>{const x=gx+gw-(graph.length-1-i)*gw/95,y=gy+gh*(1-v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  ctx.fillStyle=C.mu;ctx.textAlign='right';ctx.fillText('time scale',gx+gw,gy+gh+13);
  ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.fillText(slow.scale.toFixed(2)+'×',gx,gy+gh+13);
  ctx.textAlign='center';ctx.fillStyle=C.mu;ctx.fillText('Click or Space to shoot · the last hit triggers slow-mo',VW/2,VH-8-K.BARS*slowAmount());
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);if(document.hidden){last=0;return;}
  let rdt=last?(t-last)/1000:0.016;last=t;if(!(rdt>0))rdt=0.016;rdt=Math.min(rdt,0.033);
  const scale=updateSlowmo(rdt);
  updateWorld(rdt*scale);updateUI(rdt);draw();
}
function act(){userT=3.5;if(enemies.some(o=>o.alive))fire();else if(slow.t<0){spawn();respawnT=-1;}}
cv.addEventListener('pointerdown',e=>{act();e.preventDefault();});
addEventListener('keydown',e=>{
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  if((e.key===' '||e.key==='Enter'||e.key==='x'||e.key==='z')&&!e.repeat)act();
});
requestAnimationFrame(frame);
})();
</script></body></html>
